appId: com.jessicahirsh.sift
name: "Start at Chorus Setting"
---

# Turning on "Start at chorus" makes the next card start mid-song instead of
# at 0:00. The E2E build runs the mock provider, whose tracks run 2:17–5:54,
# so whichever source answers the start is at least 0:13: a lyrics chorus
# can't start before 10% of the track (minus a 0.5 s lead-in), and the
# estimate (used when the simulator can't reach LRCLIB) is at least 0:30.
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- tapOn: "Start Sifting"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# With the setting off (the default), the first card starts at 0:00.
- extendedWaitUntil:
    visible:
      id: "elapsed-time"
      text: "0:0[0-9]"
    timeout: 10000

- tapOn:
    id: "settings-button"

- extendedWaitUntil:
    visible:
      id: "start-at-chorus-switch"
    timeout: 30000

- tapOn:
    id: "start-at-chorus-switch"

# Close the modal by swiping down, and wait for the deck again rather than
# asserting mid-transition.
- swipe:
    start: "50%,30%"
    end: "50%,90%"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# The next card should start at its chorus. Skipping stops the previous song
# and resets the clock to 0:00, so reaching 0:13 within 8 s (the chorus can
# take up to 2.5 s to resolve) means the song started mid-track: one played
# from 0:00 couldn't get there in time.
- tapOn: "Skip"

- extendedWaitUntil:
    visible:
      id: "elapsed-time"
      text: "(0:1[3-9]|0:[2-5][0-9]|[1-9]:[0-9][0-9])"
    timeout: 8000
