appId: com.jessicahirsh.sift
name: "Save Failure Shows Retry, Retry Recovers"
---

# Exercises Done's "Save kept songs as a playlist" when the save fails:
# the error, the button turning into Retry, and Retry saving. Unreachable
# without failure injection (the mock's playlist calls never fail on their
# own).
#
# Injection: the e2e-simulator build bakes EXPO_PUBLIC_MOCK_FAIL_ADDS=2 into
# the bundle (eas.json), which makes MockMusicProvider reject the FIRST TWO
# addToPlaylist calls of each app launch; later calls succeed. Build-time
# env cannot be scoped to a single flow, so this is only safe because no
# other flow calls addToPlaylist: a Keep writes nothing to Music, and only
# a save into an existing "- Sifted" playlist adds to one. This flow sifts
# "Road Trip", whose pre-seeded "Road Trip - Sifted" holds 2 of its 3 songs
# (drivers license, Peaches), so saving its keeps adds the third (Kiss Me
# More):
#   add #1 (Save, after Finish)       rejects -> error, button says Retry
#   add #2 (Save, Done shown again)   rejects -> error, button says Retry
#   add #3 (Retry)                    succeeds -> saved confirmation
# Each step waits for a state only that step can produce (the error, the
# button's title), so no tap lands while a save is still running.
# Scoping injection to exactly one flow at runtime could now use a launch
# argument, as SiftResetState does (services/e2eReset); not done yet.
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- tapOn:
    id: "source-playlist"

- extendedWaitUntil:
    visible:
      id: "playlist-picker-modal"
    timeout: 30000

- tapOn:
    id: "playlist-row-playlist-3"

# The picker modal slides out — wait for it to leave, don't assert instantly.
- extendedWaitUntil:
    notVisible:
      id: "playlist-picker-modal"
    timeout: 30000

# An older build saved drivers license and Peaches to "Road Trip - Sifted":
# the first look at Road Trip remembers them as kept, so a sift would leave
# them out. The switch brings them back, for a sift of all three.
- extendedWaitUntil:
    visible:
      id: "reviewed-note"
      text: "2 songs you’ve already kept are left out of new sifts\\."
    timeout: 30000
- tapOn:
    id: "include-sifted-switch"
- extendedWaitUntil:
    visible:
      id: "reviewed-note"
      text: "Songs you’ve already kept are included in new sifts\\. Songs you removed stay out\\."
    timeout: 10000

# Most Played first, so the song missing from "Road Trip - Sifted" (Kiss Me
# More, 56 plays) is the first card. Let the native sheet finish sliding in
# before tapping (see 10_sort_picker.yaml).
- tapOn: "Least Played"
- extendedWaitUntil:
    visible: "Most Played"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Most Played"
- extendedWaitUntil:
    notVisible: "Least Played"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Kiss Me More"
    timeout: 30000

- tapOn: "Keep"
- waitForAnimationToEnd

- tapOn:
    id: "finish-button"

- extendedWaitUntil:
    visible: "Save kept songs as a playlist"
    timeout: 30000

# Add #1 rejects: the error, and the button becomes Retry.
- tapOn:
    id: "save-kept-playlist"

- extendedWaitUntil:
    visible:
      id: "save-kept-status"
      text: ".*Simulated add failure.*"
    timeout: 30000
- assertVisible: "Retry"

# Keep the other two (already in "Road Trip - Sifted") and finish the sift.
- tapOn:
    id: "done-continue"

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

- tapOn: "Keep"
- waitForAnimationToEnd
- tapOn: "Keep"
- waitForAnimationToEnd

# Done again: a fresh button, not the earlier Retry.
- extendedWaitUntil:
    visible: "Save kept songs as a playlist"
    timeout: 30000
- assertNotVisible: "Retry"

# Add #2 rejects too.
- tapOn:
    id: "save-kept-playlist"

- extendedWaitUntil:
    visible: "Retry"
    timeout: 30000
- assertVisible:
    id: "save-kept-status"
    text: ".*Simulated add failure.*"

# Retry: add #3 succeeds. Only the missing song is added.
- tapOn:
    id: "save-kept-playlist"

- extendedWaitUntil:
    visible:
      id: "save-kept-status"
      text: "Saved 1 song to \"Road Trip - Sifted\"\\."
    timeout: 30000

- assertNotVisible:
    id: "save-kept-playlist"
