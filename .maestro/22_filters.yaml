appId: com.jessicahirsh.sift
name: "Plays and Added Filters"
---

# Setup's Plays and Added pick which songs a sift takes. Every song in the
# mock library has been played more than 20 times, so "20 or fewer" leaves
# none, and Setup says so instead of starting an empty sift.
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- assertVisible:
    id: "filter-plays"
    text: "Any"

- tapOn:
    id: "filter-plays"

- tapOn: "20 or fewer"

- extendedWaitUntil:
    visible:
      id: "filter-plays"
      text: "20 or fewer"
    timeout: 10000

# Expected to stay on Setup with an error, so not the shared step (which
# checks that Setup goes away); the error wait below checks the tap.
- tapOn:
    id: "setup-start-sifting"

- extendedWaitUntil:
    visible:
      id: "setup-error"
      text: "No songs match your Plays and Added choices\\."
    timeout: 30000

# Back to any number of plays: the sift starts.
- tapOn:
    id: "filter-plays"

- tapOn: "Any"

# The sheet closes before the choice lands: wait for it, so the tap below
# doesn't land mid-dismissal.
- extendedWaitUntil:
    visible:
      id: "filter-plays"
      text: "Any"
    timeout: 10000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000
