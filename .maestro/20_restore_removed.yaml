appId: com.jessicahirsh.sift
name: "Restore a Removed Song on Done"
---

# Done lists the songs removed in this sift, each with Restore, which puts
# it back and counts it as kept.
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- tapOn: "Start Sifting"

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 30000

- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 500

- extendedWaitUntil:
    visible:
      id: "stat-removed"
      text: "1 removed"
    timeout: 10000

- tapOn:
    id: "finish-button"

- extendedWaitUntil:
    visible:
      id: "restore-track-mock-7"
    timeout: 30000

- tapOn:
    id: "restore-track-mock-7"

- extendedWaitUntil:
    visible:
      id: "nothing-removed"
    timeout: 10000

- assertVisible:
    id: "summary-count-kept"
    text: "1"
- assertVisible:
    id: "summary-count-removed"
    text: "0"
