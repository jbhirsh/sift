appId: com.jessicahirsh.sift
name: "Complete All Tracks"
---

# Sift through all 10 mock tracks to reach the done screen
- launchApp:
    clearState: true

- waitForAnimationToEnd

# Wait for the setup screen before tapping Start Sifting: on a cold,
# clearState launch the button can render before the screen is ready, and
# a tap landing then is lost (flow 05 hit this in CI: no card within 30s).
- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- tapOn: "Start Sifting"

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# Sift through all 10 tracks (keep them all for simplicity)
- repeat:
    times: 10
    commands:
      - tapOn: "Keep"
      - waitForAnimationToEnd

# Verify done screen — sifting → done is a screen transition, so wait for it
- extendedWaitUntil:
    visible:
      id: "done-title"
      text: "All done."
    timeout: 30000

# Verify summary — all 10 kept
- assertVisible:
    id: "summary-count-kept"
    text: "10"
- assertVisible:
    id: "summary-count-skipped"
    text: "0"

# Verify "Start Over" button is available
- assertVisible: "Start Over"
