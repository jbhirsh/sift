appId: com.jessicahirsh.sift
name: "Complete All Tracks"
---

# Sift through all 10 mock tracks to reach the done screen
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

# Wait for the setup screen before tapping Start Sifting: on a cold,
# fresh launch the button can render before the screen is ready, and
# a tap landing then is lost (flow 05 hit this in CI: no card within 30s).
- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# Sift through all 10 tracks (keep them all for simplicity)
# Each tap waits until the screen stops changing, which with the E2E
# build's still song clock is soon after the card has gone.
- repeat:
    times: 10
    commands:
      - tapOn:
          id: "action-keep"

# Verify done screen — sifting → done is a screen transition, so wait for it
- extendedWaitUntil:
    visible:
      id: "done-title"
      text: "All done."
    timeout: 30000

# Verify summary — all 10 kept
- assertVisible:
    id: "summary-count-kept"
    text: "10"
- assertVisible:
    id: "summary-count-skipped"
    text: "0"

# Verify "Start Over" button is available
- assertVisible: "Start Over"
