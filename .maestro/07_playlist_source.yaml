appId: com.jessicahirsh.sift
name: "Playlist Source - Select and Sift"
---

# Test selecting a playlist as the sift source and sifting through it
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

# Verify setup screen
- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

# Tap "Playlist" in the source picker
- tapOn:
    id: "source-playlist"

# Wait for playlist picker modal to appear
- extendedWaitUntil:
    visible:
      id: "playlist-picker-modal"
    timeout: 30000

# Verify picker shows playlists (mock provider returns 3)
- assertVisible:
    id: "playlist-picker-list"

# Select the first playlist
- tapOn:
    id: "playlist-row-playlist-1"

# Verify modal dismissed and playlist name is shown on setup screen. The
# modal slides out, so wait for it to leave instead of asserting instantly.
- extendedWaitUntil:
    notVisible:
      id: "playlist-picker-modal"
    timeout: 30000
- assertVisible: "Change"

# Start sifting with the selected playlist
- runFlow: shared/start_sifting.yaml

# Wait for sift screen to appear
- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# Verify sift screen works with playlist tracks
- assertVisible:
    id: "card-track-name"
- assertVisible: "Keep"
- assertVisible: "Skip"
- assertVisible: "Remove"

# Make a decision to verify the flow works
- tapOn:
    id: "action-keep"
- waitForAnimationToEnd

- assertVisible:
    id: "stat-kept"
    text: "1 kept"

# ── Finish the playlist (Chill Vibes has 3 tracks) and reach Done ──
- tapOn:
    id: "action-keep"
- waitForAnimationToEnd
- tapOn:
    id: "action-keep"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "done-title"
    timeout: 30000

- assertVisible:
    id: "summary-count-kept"
    text: "3"
- assertVisible:
    id: "summary-count-removed"
    text: "0"

# A Keep writes nothing to Music: the three keeps are remembered for
# Chill Vibes, and Done offers to save them as a playlist. Chill Vibes has
# no "- Sifted" playlist in the mock, so the save creates one (createPlaylist,
# which is never injected; 09_save_failure_retry.yaml covers a failed save
# and Retry via the EXPO_PUBLIC_MOCK_FAIL_ADDS injection).
- extendedWaitUntil:
    visible: "Save kept songs as a playlist"
    timeout: 30000
- tapOn:
    id: "save-kept-playlist"

- extendedWaitUntil:
    visible:
      id: "save-kept-status"
      text: "Saved 3 songs to \"Chill Vibes - Sifted\"\\."
    timeout: 30000
- assertNotVisible:
    id: "save-kept-playlist"

# ── Start Over with decisions must ask for confirmation ──
- tapOn: "Start Over"

# Maestro matches text as a regex: an unescaped "?" would also match the
# screen's own "Start Over" button.
- extendedWaitUntil:
    visible: "Start Over\\?"
    timeout: 30000

# Cancel keeps everything: still on Done, saved message intact.
# Wait for the Cancel button itself, not just the "Start Over?" title above:
# on a slow runner the native alert's buttons enter the accessibility tree a
# beat after its title, so a bare tapOn "Cancel" intermittently misses it.
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 30000
- tapOn: "Cancel"

- extendedWaitUntil:
    notVisible: "Start Over\\?"
    timeout: 30000
- assertVisible:
    id: "done-title"
- assertVisible:
    id: "save-kept-status"
