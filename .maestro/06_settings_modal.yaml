appId: com.jessicahirsh.sift
name: "Settings Modal"
---

# Test opening and interacting with the settings modal
- launchApp:
    clearState: true

- waitForAnimationToEnd

# Wait for the setup screen before tapping Start Sifting: on a cold,
# clearState launch the button can render before the screen is ready, and
# a tap landing then is lost (flow 05 hit this in CI: no card within 30s).
- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- tapOn: "Start Sifting"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# Open settings modal
- tapOn:
    id: "settings-button"

# Wait for the modal content to appear
- extendedWaitUntil:
    visible:
      id: "check-connection-button"
    timeout: 30000

# Verify connection status elements
- assertVisible:
    id: "connection-status-label"

# Tap check connection
- tapOn:
    id: "check-connection-button"

# Wait for connection check to complete — mock provider always returns connected
- extendedWaitUntil:
    visible: "Connected"
    timeout: 30000

# Close the modal by swiping down
- swipe:
    start: "50%,30%"
    end: "50%,90%"
