appId: com.jessicahirsh.sift
name: "Failed Removal Shows the Removal-Errors Warning"
---

# Exercises the removal-errors warning block on the Done screen, which is
# unreachable without failure injection (the mock's removals never fail on
# their own).
#
# Injection: the e2e-simulator build bakes EXPO_PUBLIC_MOCK_FAIL_REMOVES=1
# into the bundle (eas.json), which makes MockMusicProvider fail the library
# removal of the FIRST song removed in each app launch, retries included
# (#151 retries failed removals); other songs' removals succeed. This is
# only safe because of a flow audit (see the injection comment in
# MockMusicProvider.ts): every Remove goes through that removal, from a
# library or a playlist sift; 03 never reaches Done and asserts only
# DECIDE-driven stats that a silently-failed native removal does not
# change, and 15 and 24 rely on their first remove failing; the other
# flows that Remove assert nothing it changes. removeFromPlaylist is
# deliberately NOT injectable (see the mock's flow audit).
#
# Default sort is Least Played, so the first card is "Peaches" (playCount
# 28). Removing it takes the injected failure: the decision itself still
# counts (removal intent is always logged), but the native removal fails and
# is queued into removalErrors for the Done screen's warning block.
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

- assertVisible:
    id: "card-track-name"
    text: "Peaches"

# Remove the first track — the injected failure fires here
- tapOn: "Remove"
- waitForAnimationToEnd

# The first library remove explains where removed songs go, and the failure
# shows during the sift, not only on Done (#141).
- extendedWaitUntil:
    visible:
      id: "first-remove-note"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "unsynced-chip"
    timeout: 30000

# Keep the remaining 9 tracks to reach Done
- repeat:
    times: 9
    commands:
      - tapOn: "Keep"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "done-title"
    timeout: 30000

- assertVisible:
    id: "summary-count-removed"
    text: "1"

# The warning block names the track that is actually still in place, and
# the blanket "have been moved" claim gives way to real counts.
- assertVisible:
    id: "removal-errors"
- assertVisible:
    id: "removal-error-0"
    text: "Peaches"
- assertVisible: '1 of 1 could not be added to "Sift — Removed" in Music; it is still in place\.'
