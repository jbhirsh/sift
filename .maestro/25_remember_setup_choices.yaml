appId: com.jessicahirsh.sift
name: "Setup Remembers Sort and Filters"
---

# Setup's sort order and its Plays and Added choices are remembered across
# launches (#175): pick them, relaunch, and they're still picked.
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000
- assertVisible: "Least Played"

# The sort: a native action sheet. Let it finish sliding in before the tap
# (see 10_sort_picker).
- tapOn: "Least Played"
- extendedWaitUntil:
    visible: "Most Played"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Most Played"
- extendedWaitUntil:
    notVisible: "Least Played"
    timeout: 30000

# Added: over 3 years ago.
- tapOn:
    id: "filter-added"
- extendedWaitUntil:
    visible: "Over 3 years ago"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Over 3 years ago"
- extendedWaitUntil:
    visible:
      id: "filter-added"
      text: "Over 3 years ago"
    timeout: 10000

# Relaunch (launchApp stops the app first). The choices load from storage
# just after Setup appears, so wait for them rather than assert at once.
- launchApp

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- extendedWaitUntil:
    visible: "Most Played"
    timeout: 10000

- assertVisible:
    id: "filter-added"
    text: "Over 3 years ago"

- assertVisible:
    id: "filter-plays"
    text: "Any"
