appId: com.jessicahirsh.sift
name: "Undo a Remove"
---

# The latest decision waits a few seconds before it reaches the music
# service, and Undo takes it back: the same card returns, and nothing was
# removed (#152).
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 30000

# Undo has to land inside the undo window. The app's is 5 s, which a slow
# runner can spend just finding the pill (a run failed this way), so the
# E2E build lengthens it to 30 s (eas.json EXPO_PUBLIC_UNDO_WINDOW_MS; unit
# tests pin the 5 s). After a tap Maestro also waits for the screen to
# settle, and the playing song's seek bar never does, so that wait is
# capped. The Undo tap waits for the pill itself.
- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 500

- tapOn:
    id: "undo-pill"
    waitToSettleTimeoutMs: 500

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 10000

- assertVisible:
    id: "remaining-count"
    text: "10 left"

- assertVisible:
    id: "stat-removed"
    text: "0 removed"

- assertNotVisible:
    id: "undo-pill"
