appId: com.jessicahirsh.sift
name: "Setup Says How Many Songs Were Deleted in Music"
---

# Sift can't delete library songs: a Remove collects the song in "Sift —
# Removed" for the user to delete in Music. A later launch notices the ones
# deleted since and says so on Setup, once (#183).
#
# The E2E build's mock stands in for Music: launched with SiftDeletedInMusic,
# every song an earlier launch collected counts as deleted since. The build
# fails the first removal of each launch (see flow 11), so of two Removes
# only the second, drivers license, reaches "Sift — Removed".
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 30000

# The playing song's seek bar keeps the screen from settling (flow 15).
- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 500

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "drivers license"
    timeout: 30000

- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 500

- extendedWaitUntil:
    visible:
      id: "stat-removed"
      text: "2 removed"
    timeout: 10000

# Finish sends the held Remove; Done's Finish in Music card shows once a
# removal reached "Sift — Removed".
- tapOn:
    id: "finish-button"

- extendedWaitUntil:
    visible:
      id: "finish-in-music"
    timeout: 30000

# Start Over clears the saved session before Setup shows, so the relaunch
# below has no sift to offer and goes straight to Setup. It never
# un-removes: drivers license stays collected.
- scrollUntilVisible:
    element:
      id: "done-start-over"
# Let the list stop: a tap on a list still coasting only stops it (flow 24).
- waitForAnimationToEnd
- tapOn:
    id: "done-start-over"

- extendedWaitUntil:
    visible: "Discard and Start Over"
    timeout: 30000
- tapOn: "Discard and Start Over"

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

# Later, the user has emptied "Sift — Removed" in Music.
- stopApp
- launchApp:
    arguments:
      SiftDeletedInMusic: "true"

- extendedWaitUntil:
    visible:
      id: "deleted-in-music-note"
      text: "You deleted 1 song from your library in Music\\."
    timeout: 30000
# For the PR's picture of the note (in maestro-results' suite-debug).
- waitForAnimationToEnd
- takeScreenshot: deleted-in-music-note

# Said once: the deleted songs are forgotten (services/DeletedInMusic,
# unit-tested), so no later launch counts them again.
