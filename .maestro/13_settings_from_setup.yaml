appId: com.jessicahirsh.sift
name: "Settings From Setup"
---

# Settings opens from the Setup screen, before any song plays (#138), and
# its Done button closes it.
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

# This flow runs first in the suite, on the coldest app and driver: a tap
# landing right after launch can be lost (flow 05 hit the same). Wait for
# the gear itself, and tap again (up to 3 times) only while the sheet
# hasn't opened. A sheet that opens without the switch still fails below.
- extendedWaitUntil:
    visible:
      id: "settings-button"
    timeout: 30000

- repeat:
    times: 3
    while:
      notVisible:
        id: "settings-done-button"
    commands:
      - tapOn:
          id: "settings-button"
      - extendedWaitUntil:
          visible:
            id: "settings-done-button"
          timeout: 10000
          optional: true

- extendedWaitUntil:
    visible:
      id: "start-at-chorus-switch"
    timeout: 30000

- tapOn:
    id: "settings-done-button"

# Wait for the sheet to slide away rather than asserting mid-transition.
- extendedWaitUntil:
    notVisible:
      id: "settings-done-button"
    timeout: 30000

- extendedWaitUntil:
    visible: "Start Sifting"
    timeout: 30000
