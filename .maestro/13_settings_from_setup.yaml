appId: com.jessicahirsh.sift
name: "Settings From Setup"
---

# Settings opens from the Setup screen, before any song plays (#138), and
# its Done button closes it.
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

# Wait for the gear itself, then tap it once. If the sheet doesn't open,
# the trace (maestro-results/trace.txt) says whether the tap reached the
# app: fix that, don't tap again.
- extendedWaitUntil:
    visible:
      id: "settings-button"
    timeout: 30000

- tapOn:
    id: "settings-button"

- extendedWaitUntil:
    visible:
      id: "settings-done-button"
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: "start-at-chorus-switch"
    timeout: 30000

- tapOn:
    id: "settings-done-button"

# Wait for the sheet to slide away rather than asserting mid-transition.
- extendedWaitUntil:
    notVisible:
      id: "settings-done-button"
    timeout: 30000

- extendedWaitUntil:
    visible: "Start Sifting"
    timeout: 30000
