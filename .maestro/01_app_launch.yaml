appId: com.jessicahirsh.sift
name: "App Launch - Setup Screen"
---

# Verify the app launches to the setup screen
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

# Apple Music is the only provider (Spotify was removed, #140): no service
# picker, and no Spotify option.
- assertNotVisible: "Music service"
- assertNotVisible: "Spotify"

# Verify sort order picker is visible
- assertVisible: "Least Played"

# Verify source picker is visible
- assertVisible: "Sift source"
- assertVisible: "Library"
- assertVisible: "Playlist"

# Verify start button is present
- assertVisible: "Start Sifting"
