appId: com.jessicahirsh.sift
name: "Library Sift Skips Kept Songs"
---

# Songs kept in one library sift are left out of the next (#143), and Setup
# says so beside the switch that brings them back.
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

# Nothing kept yet, so no switch.
- assertNotVisible:
    id: "include-sifted-switch"

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

- tapOn:
    id: "action-keep"
- waitForAnimationToEnd
- tapOn:
    id: "action-keep"
- waitForAnimationToEnd

- tapOn:
    id: "finish-button"

- extendedWaitUntil:
    visible:
      id: "done-start-over"
    timeout: 30000

- tapOn:
    id: "done-start-over"

- extendedWaitUntil:
    visible: "Discard and Start Over"
    timeout: 30000
- tapOn: "Discard and Start Over"

- extendedWaitUntil:
    visible:
      id: "reviewed-note"
      text: "2 songs you’ve already kept are left out of new sifts\\."
    timeout: 30000

- assertVisible:
    id: "include-sifted-switch"

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

- assertVisible:
    id: "remaining-count"
    text: "8 left"
