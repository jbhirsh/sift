appId: com.jessicahirsh.sift
name: "Change an Earlier Decision"
---

# Beyond Undo's last decision: the decisions list, from the Sift header,
# changes any card's decision.
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 30000

- tapOn:
    id: "action-skip"
- tapOn:
    id: "action-skip"

- extendedWaitUntil:
    visible:
      id: "stat-skipped"
      text: "2 skipped"
    timeout: 10000

- tapOn:
    id: "decisions-button"

- extendedWaitUntil:
    visible:
      id: "decisions-sheet"
    timeout: 10000

# The first card, Peaches, sent already: kept instead.
- tapOn:
    id: "decision-keep-mock-7"

- tapOn:
    id: "decisions-done"

- extendedWaitUntil:
    visible:
      id: "stat-kept"
      text: "1 kept"
    timeout: 10000

- assertVisible:
    id: "stat-skipped"
    text: "1 skipped"
