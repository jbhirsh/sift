appId: com.jessicahirsh.sift
name: "Remove and Restore in a Playlist Sift"
---

# A playlist sift's Remove collects the song in "Sift — Removed", as a
# library sift's does: Apple Music won't let Sift edit a playlist the user
# made. The E2E build fails each launch's first removed song
# (EXPO_PUBLIC_MOCK_FAIL_REMOVES=1), so this covers a removal that failed
# and one that landed, and Restore for both.
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- tapOn:
    id: "source-playlist"

- extendedWaitUntil:
    visible:
      id: "playlist-picker-modal"
    timeout: 30000

# Chill Vibes: Levitating, Heat Waves, Bohemian Rhapsody (least played first).
- tapOn:
    id: "playlist-row-playlist-1"

- extendedWaitUntil:
    notVisible:
      id: "playlist-picker-modal"
    timeout: 30000

# Setup says where removed songs go before the first swipe.
- assertVisible:
    id: "remove-explanation"
    text: 'Removed songs are collected in "Sift — Removed".*'

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Levitating"
    timeout: 30000

# The launch's first removed song: its removal fails.
- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 500

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Heat Waves"
    timeout: 10000

- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 500

- extendedWaitUntil:
    visible:
      id: "stat-removed"
      text: "2 removed"
    timeout: 10000

# Finish sends the held decision: Heat Waves lands in "Sift — Removed".
- tapOn:
    id: "finish-button"

- extendedWaitUntil:
    visible: '1 of 2 have been added to "Sift — Removed" in Music; 1 could not be\.'
    timeout: 30000

# One landed, so Done's Finish in Music card says how to delete it in
# Music, with Open Music and Share List (#173).
- assertVisible:
    id: "finish-in-music"
    text: "Finish in Music"

- scrollUntilVisible:
    element:
      id: "share-removed"

- assertVisible:
    id: "open-music"

# Restore the one that landed: it comes back out of "Sift — Removed".
- scrollUntilVisible:
    element:
      id: "restore-track-mock-10"

- tapOn:
    id: "restore-track-mock-10"

- extendedWaitUntil:
    notVisible:
      id: "restore-track-mock-10"
    timeout: 10000

- assertVisible:
    id: "summary-count-removed"
    text: "1"

# Restore the one that failed: it never went in, so it's just restored.
- scrollUntilVisible:
    element:
      id: "restore-track-mock-3"

- tapOn:
    id: "restore-track-mock-3"

- extendedWaitUntil:
    visible:
      id: "nothing-removed"
    timeout: 10000

- assertVisible:
    id: "summary-count-kept"
    text: "2"
