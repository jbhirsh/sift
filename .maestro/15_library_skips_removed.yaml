appId: com.jessicahirsh.sift
name: "Library Sift Skips Removed Songs"
---

# An Apple Music library Remove only moves the song into "Sift — Removed";
# it stays in the library. The next library sift must not offer it again,
# unless the removal failed (#139). The E2E build's mock provider is Apple
# Music.
#
# Default sort is Least Played: Peaches (playCount 28), drivers license
# (31), Montero (39), ... The build fails the library removal of the first
# song removed in each launch, retries included (see flow 11), so Peaches'
# removal fails and drivers license's succeeds.
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 30000

- tapOn:
    id: "action-remove"

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "drivers license"
    timeout: 30000

- tapOn:
    id: "action-remove"
- extendedWaitUntil:
    visible:
      id: "stat-removed"
      text: "2 removed"
    timeout: 10000

# Each tap waits until the screen stops changing, which with the E2E
# build's still song clock is soon after the card has gone.
- repeat:
    times: 8
    commands:
      - tapOn:
          id: "action-keep"

- extendedWaitUntil:
    visible:
      id: "done-title"
    timeout: 30000

- assertVisible:
    id: "summary-count-removed"
    text: "2"

# The finished session is on disk before stopApp, which kills the app with
# no background flush: SiftContext writes it as Done shows, and its E2E mark
# says once it has.
- extendedWaitUntil:
    visible:
      id: "session-saved"
    timeout: 10000

# A second library sift: relaunch and start one. A finished session isn't
# offered for resume, so Setup goes straight to Start Sifting.
- stopApp
- launchApp

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

# The 8 kept songs would be left out too (#143, flow 17): include them, so
# only the removal filter is in play. It applies either way.
- extendedWaitUntil:
    visible:
      id: "include-sifted-switch"
    timeout: 30000
- tapOn:
    id: "include-sifted-switch"
- extendedWaitUntil:
    visible:
      id: "reviewed-note"
      text: "Songs you’ve already kept are included in new sifts\\. Songs you removed stay out\\."
    timeout: 10000

- runFlow: shared/start_sifting.yaml

# Peaches' removal failed, so it is offered again; drivers license was
# removed, so the sift goes from Peaches straight to Montero, one short.
- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 30000

- assertVisible:
    id: "remaining-count"
    text: "9 left"

- tapOn:
    id: "action-skip"

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Montero \\(Call Me By Your Name\\)"
    timeout: 30000
