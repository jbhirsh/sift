appId: com.jessicahirsh.sift
name: "Library Sift Skips Removed Songs"
---

# An Apple Music library Remove only moves the song into "Sift — Removed";
# it stays in the library. The next library sift must not offer it again,
# unless the removal failed (#139). The E2E build's mock provider is Apple
# Music.
#
# Default sort is Least Played: Peaches (playCount 28), drivers license
# (31), Montero (39), ... The build fails the library removal of the first
# song removed in each launch, retries included (see flow 11), so Peaches'
# removal fails and drivers license's succeeds.
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 30000

- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 1500

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "drivers license"
    timeout: 30000

- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 1500

# The playing song's seek bar keeps the screen from ever "settling", so
# Maestro's settle and animation waits would each run to their limit (about
# 6 s per card). Capped: the card flies off in 300 ms, and each tap still
# leaves 2 s before the next.
- repeat:
    times: 8
    commands:
      - tapOn:
          text: "Keep"
          waitToSettleTimeoutMs: 500
      - waitForAnimationToEnd:
          timeout: 1500

- extendedWaitUntil:
    visible:
      id: "done-title"
    timeout: 30000

- assertVisible:
    id: "summary-count-removed"
    text: "2"

# Give the autosave (debounced 500 ms) time to write the finished session:
# stopApp kills the app without a background flush, and a session saved one
# card short would pop the resume sheet on relaunch. Waits for an id that
# never appears.
- extendedWaitUntil:
    visible:
      id: "wait-for-autosave"
    timeout: 1500
    optional: true

# A second library sift: relaunch and start one. A finished session isn't
# offered for resume, so Setup goes straight to Start Sifting.
- stopApp
- launchApp

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

# The 8 kept songs would be left out too (#143, flow 17): include them, so
# only the removal filter is in play. It applies either way.
- extendedWaitUntil:
    visible:
      id: "include-sifted-switch"
    timeout: 30000
- tapOn:
    id: "include-sifted-switch"
- extendedWaitUntil:
    visible:
      id: "reviewed-note"
      text: "Songs you’ve already kept are included in new sifts\\."
    timeout: 10000

- tapOn: "Start Sifting"

# Peaches' removal failed, so it is offered again; drivers license was
# removed, so the sift goes from Peaches straight to Montero, one short.
- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Peaches"
    timeout: 30000

- assertVisible:
    id: "remaining-count"
    text: "9 left"

- tapOn: "Skip"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "card-track-name"
      text: "Montero \\(Call Me By Your Name\\)"
    timeout: 30000
