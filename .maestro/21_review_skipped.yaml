appId: com.jessicahirsh.sift
name: "Review Skipped Songs"
---

# Once every card is decided, Done offers to go through just the skipped
# songs again (#142).
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# Keep one, skip the other nine. Each tap waits out the screen's settle
# cap (the playing song's seek bar never settles), a second, which is
# longer than the guard after a decision: no tap lands on a decision
# still under way.
- tapOn:
    id: "action-keep"
    waitToSettleTimeoutMs: 1000
- repeat:
    times: 9
    commands:
      - tapOn:
          id: "action-skip"
          waitToSettleTimeoutMs: 1000

- extendedWaitUntil:
    visible:
      id: "done-review-skipped"
      text: "Review 9 skipped"
    timeout: 30000

- tapOn:
    id: "done-review-skipped"

- extendedWaitUntil:
    visible:
      id: "remaining-count"
      text: "9 left"
    timeout: 30000

- assertVisible:
    id: "stat-skipped"
    text: "0 skipped"
