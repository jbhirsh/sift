appId: com.jessicahirsh.sift
name: "Review Skipped Songs"
---

# Once every card is decided, Done offers to go through just the skipped
# songs again (#142).
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# Keep one, skip the other nine.
# Each tap waits until the screen stops changing, which with the E2E
# build's still song clock is soon after the card has gone.
- tapOn:
    id: "action-keep"
- repeat:
    times: 9
    commands:
      - tapOn:
          id: "action-skip"

- extendedWaitUntil:
    visible:
      id: "done-review-skipped"
      text: "Review 9 skipped"
    timeout: 30000

- tapOn:
    id: "done-review-skipped"

- extendedWaitUntil:
    visible:
      id: "remaining-count"
      text: "9 left"
    timeout: 30000

- assertVisible:
    id: "stat-skipped"
    text: "0 skipped"
