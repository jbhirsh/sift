appId: com.jessicahirsh.sift
name: "Sort Picker - Action Sheet Changes Track Order"
---

# The sort picker is a native ActionSheetIOS sheet. This flow verifies the
# full path end-to-end: open the sheet, pick a different order, see the
# label update, and confirm the loaded sift actually honors it — the mock
# library's most-played track is "Bohemian Rhapsody" (playCount 142), which
# must be the FIRST card under Most Played (the default Least Played would
# lead with "Peaches", playCount 28).
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000
- assertVisible: "Least Played"

# Open the native action sheet and pick Most Played.
# Let the sheet finish sliding in before tapping: its buttons are in the
# accessibility tree (so the wait above passes) while it is still animating,
# and a tap landing mid-animation can dismiss the sheet without selecting —
# seen in CI as the label never changing ('"Most Played" is visible' false).
- tapOn: "Least Played"
- extendedWaitUntil:
    visible: "Most Played"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Most Played"

# The sheet dismissed and the sort button label updated. Wait for the old
# label to go (sheet dismissal animates) rather than asserting instantly.
- extendedWaitUntil:
    notVisible: "Least Played"
    timeout: 30000
- assertVisible: "Most Played"

# Start a library sift and verify the order took effect
- tapOn: "Start Sifting"

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

- assertVisible:
    id: "card-track-name"
    text: "Bohemian Rhapsody"
