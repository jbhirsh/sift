appId: com.jessicahirsh.sift
name: "Playlist Sift Skips Kept Songs"
---

# A playlist Keep is remembered for that playlist, as a library keep is
# (#143): the next sift of it leaves the song out, and Setup says so beside
# the switch that brings it back. Workout Mix has no "- Sifted" playlist, so
# nothing is remembered from before (flow 09 covers one that has).
- launchApp:
    clearState: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- tapOn:
    id: "source-playlist"

- extendedWaitUntil:
    visible:
      id: "playlist-picker-modal"
    timeout: 30000

# Workout Mix (4 songs).
- tapOn:
    id: "playlist-row-playlist-2"

# The picker modal slides out — wait for it to leave, don't assert instantly.
- extendedWaitUntil:
    notVisible:
      id: "playlist-picker-modal"
    timeout: 30000

# Nothing kept from it yet: no switch.
- assertNotVisible:
    id: "include-sifted-switch"

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

- assertVisible:
    id: "remaining-count"
    text: "4 left"

- tapOn: "Keep"
- waitForAnimationToEnd

- tapOn:
    id: "finish-button"

- extendedWaitUntil:
    visible:
      id: "done-start-over"
    timeout: 30000

- tapOn:
    id: "done-start-over"

- extendedWaitUntil:
    visible: "Discard and Start Over"
    timeout: 30000
- tapOn: "Discard and Start Over"

# Back on Setup, still on Workout Mix, with the kept song left out.
- extendedWaitUntil:
    visible:
      id: "reviewed-note"
      text: "1 song you’ve already kept is left out of new sifts\\."
    timeout: 30000

- assertVisible:
    id: "include-sifted-switch"

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

- assertVisible:
    id: "remaining-count"
    text: "3 left"
