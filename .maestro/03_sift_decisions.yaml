appId: com.jessicahirsh.sift
name: "Sift Decisions - Keep, Remove, Skip"
---

# Test that tapping each decision button advances to the next track
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# Keep the first track
- tapOn:
    id: "action-keep"
- waitForAnimationToEnd

# Remove the second track
- tapOn:
    id: "action-remove"
- waitForAnimationToEnd

# Skip the third track
- tapOn:
    id: "action-skip"
- waitForAnimationToEnd

# Verify stats updated — text format is "N label"
- assertVisible:
    id: "stat-kept"
    text: "1 kept"
- assertVisible:
    id: "stat-removed"
    text: "1 removed"
- assertVisible:
    id: "stat-skipped"
    text: "1 skipped"
