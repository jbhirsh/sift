appId: com.jessicahirsh.sift
name: "Sift Decisions - Keep, Remove, Skip"
---

# Test that tapping each decision button advances to the next track
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

# Keep the first track, each decision landing before the next tap (a
# Keep or Remove while one is under way is turned away).
- tapOn:
    id: "action-keep"
- extendedWaitUntil:
    visible:
      id: "stat-kept"
      text: "1 kept"
    timeout: 10000

# Remove the second track
- tapOn:
    id: "action-remove"
- extendedWaitUntil:
    visible:
      id: "stat-removed"
      text: "1 removed"
    timeout: 10000

# Skip the third track
- tapOn:
    id: "action-skip"

# Verify stats updated — text format is "N label"
- extendedWaitUntil:
    visible:
      id: "stat-skipped"
      text: "1 skipped"
    timeout: 10000
- assertVisible:
    id: "stat-kept"
    text: "1 kept"
- assertVisible:
    id: "stat-removed"
    text: "1 removed"
