appId: com.jessicahirsh.sift
name: "Screenshots"
---
# CI's Screenshots and GIFs job runs this to photograph the main screens on
# the iOS Simulator, once in light and once in dark, for PR descriptions,
# the README, and visual review, which compares them with main's
# (visual-review.yml). A web export can't draw SF Symbols; this is the
# real app.
# MODE (light or dark) comes from scripts/take-screenshots.sh, which
# gathers the shots from Maestro's output folder (it refuses an absolute
# path). Nothing here asserts more than it needs to reach the next screen.
# Each shot waits for its screen to stop moving: the E2E build's song clock
# stands still (MockMusicProvider), so Sift shows the same time on every
# run and the wait ends once the screen's own motion has.
# No shot depends on the network or a timer: the mock library's covers are
# files in the app (services/mockCovers, put there by CI), so a Sift shot
# first waits for the card to say its cover has loaded (card-artwork-shown,
# components/InteractiveCard; a cover that fails to load never says it, and
# the flow fails rather than photographing a blank card), and for the
# elements that appear after an async step (the swipe hint, the Undo pill).
- launchApp:
    # A fresh start without a reinstall (services/e2eReset).
    arguments:
      SiftResetState: "true"

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-01-setup

# The sort sheet, then Cancel: the order stays the default.
- tapOn: "Least Played"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-02-sort-sheet
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Cancel"
    timeout: 10000

- runFlow: ../../.maestro/shared/start_sifting.yaml
- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "card-artwork-shown"
    timeout: 30000
# Shown after an async read of what the hint remembers; it stays until the
# first decision (SiftResetState clears it).
- extendedWaitUntil:
    visible:
      id: "swipe-hint"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-03-sift

# A Keep, then a Skip. No Remove: the E2E build fails the launch's first
# one, which would put an error on Sift and Done.
- tapOn:
    id: "action-keep"
- extendedWaitUntil:
    visible:
      id: "stat-kept"
      text: "1 kept"
    timeout: 10000
- tapOn:
    id: "action-skip"
- extendedWaitUntil:
    visible:
      id: "stat-skipped"
      text: "1 skipped"
    timeout: 10000
# The third card's cover, which 05's sheet also leaves in view, and the Undo
# pill, which stands in for the REMOVE/SKIP/KEEP words while it shows.
- extendedWaitUntil:
    visible:
      id: "card-artwork-shown"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "undo-pill"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-04-sift-undo

- tapOn:
    id: "decisions-button"
- extendedWaitUntil:
    visible:
      id: "decisions-sheet"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-05-decisions
- tapOn:
    id: "decisions-done"
- extendedWaitUntil:
    notVisible:
      id: "decisions-sheet"
    timeout: 10000

- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-done-button"
    timeout: 10000
# The sheet says when its slide has finished (settings-shown, App.tsx).
- extendedWaitUntil:
    visible:
      id: "settings-shown"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-06-settings
- tapOn:
    id: "settings-done-button"
- extendedWaitUntil:
    notVisible:
      id: "settings-done-button"
    timeout: 10000

- tapOn:
    id: "finish-button"
- extendedWaitUntil:
    visible:
      id: "done-title"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-07-done
