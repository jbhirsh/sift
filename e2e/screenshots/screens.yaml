appId: com.jessicahirsh.sift
name: "Screenshots"
---
# Not a test: the E2E job runs this after the suite to photograph the main
# screens on the iOS Simulator, once in light and once in dark, for PR
# descriptions. A web export can't draw SF Symbols; this is the real app.
# MODE (light or dark) comes from scripts/take-screenshots.sh, which
# gathers the shots from Maestro's output folder (it refuses an absolute
# path). Nothing here asserts more than it needs to reach the next screen.
# On Sift the playing song's time keeps changing, so a wait for the screen
# to settle there is capped at 3 s instead of its default 15.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-01-setup

# The sort sheet, then Cancel: the order stays the default.
- tapOn: "Least Played"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${MODE}-02-sort-sheet
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Cancel"
    timeout: 10000

- runFlow: ../../.maestro/shared/start_sifting.yaml
- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${MODE}-03-sift

# A Keep, then a Skip. No Remove: the E2E build fails the launch's first
# one, which would put an error on Sift and Done.
- tapOn:
    text: "Keep"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "stat-kept"
      text: "1 kept"
    timeout: 10000
# The card's fly-off: a tap before it settles is turned away.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Skip"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "stat-skipped"
      text: "1 skipped"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${MODE}-04-sift-undo

- tapOn:
    id: "decisions-button"
- extendedWaitUntil:
    visible:
      id: "decisions-sheet"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${MODE}-05-decisions
- tapOn:
    id: "decisions-done"
- extendedWaitUntil:
    notVisible:
      id: "decisions-sheet"
    timeout: 10000

- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-done-button"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${MODE}-06-settings
- tapOn:
    id: "settings-done-button"
- extendedWaitUntil:
    notVisible:
      id: "settings-done-button"
    timeout: 10000

- tapOn:
    id: "finish-button"
- extendedWaitUntil:
    visible:
      id: "done-title"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${MODE}-07-done
