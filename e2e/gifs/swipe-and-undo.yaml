appId: com.jessicahirsh.sift
name: "GIF: swipe to keep, skip, undo"
---
# A PR GIF (scripts/take-gifs.sh, scripts/pr-gifs.ts). Not a test: it
# waits only as much as it needs to reach the next step. No fixed pause
# between steps: Maestro finding the next element already leaves a
# person's pause. Only the end holds still for a moment, for whoever
# watches, so the loop doesn't jump straight back (jbhirsh/ci#58's GIF
# hold).
# Everything before startRecording gets the app to where the GIF begins;
# the recording is named after this file. It must end with the `-end` screenshot, which
# says the steps all ran (take-gifs.sh drops a recording without one).

# SiftShowTouches turns on the drawn touches (components/TouchOverlay) and
# SiftResetState starts fresh without a reinstall (services/e2eReset); only
# the E2E build reads either. Keep "true" quoted: Maestro passes an
# unquoted boolean in a form iOS doesn't read.
- launchApp:
    arguments:
      SiftResetState: "true"
      SiftShowTouches: "true"

- extendedWaitUntil:
    visible:
      id: "setup-brand"
    timeout: 30000

- runFlow: ../../.maestro/shared/start_sifting.yaml

- extendedWaitUntil:
    visible:
      id: "card-track-name"
    timeout: 30000

- startRecording: swipe-and-undo

# Keep, by swiping the card right, at a person's speed: Maestro's default
# is quicker than a hand, and the drag would be a few frames.
- swipe:
    from:
      id: "card-track-name"
    direction: RIGHT
    duration: 800
- extendedWaitUntil:
    visible:
      id: "stat-kept"
      text: "1 kept"
    timeout: 10000

# Skip, by the button.
- tapOn:
    id: "action-skip"
- extendedWaitUntil:
    visible:
      id: "stat-skipped"
      text: "1 skipped"
    timeout: 10000

# Undo brings the skipped card back.
- tapOn:
    id: "undo-pill"
- extendedWaitUntil:
    visible:
      id: "stat-skipped"
      text: "0 skipped"
    timeout: 10000
# The end hold, for the viewer: a wait for an element no screen has, which
# only its 1.5 s ends (ci's gif/video.mjs keeps 1.5 s after the last touch).
- extendedWaitUntil:
    visible:
      id: "gif-end-hold"
    timeout: 1500
    optional: true

- stopRecording
- takeScreenshot: swipe-and-undo-end
