name: Simulator with the app
description: >-
  Boots an iPhone simulator and installs the E2E app on it, for ci.yml's
  three simulator jobs (E2E, the accessibility audit, screenshots and GIFs).
  Only the build job builds the app; this takes it from actions/cache, under
  the key the check job works out, or from the build job's artifact when this
  run built it and the cache isn't there yet, then launches it once and
  quits it, so the job's own launch isn't its first. With `maestro`, it also
  puts Maestro on the PATH, cached under its latest release.

inputs:
  app-key:
    description: The app's cache key (the check job's app_key output)
    required: true
  maestro:
    description: Also install Maestro (the audit doesn't use it)
    default: 'true'
  load-log:
    description: >-
      Where to sample the machine's load for the rest of the job
      (scripts/machine-load.sh): a file in the folder the job uploads
    required: true

runs:
  using: composite
  steps:
    # First, so the samples cover the simulator's boot too.
    - name: Start sampling the machine's load
      shell: bash
      run: scripts/machine-load.sh "${{ inputs.load-log }}"

    # Booting takes 1.5-3 min, so it starts first and runs while Maestro and
    # the app are fetched; the wait for it comes just before installing.
    # Pinned to one model (SIM_MODEL), on the newest iOS runtime that has
    # it: the visual regression compares screenshots pixel for pixel with
    # baselines (e2e/screenshots/baselines), so the screen they come from
    # can't change with the runner image's device list. When an image drops
    # the model this fails and lists what it has: move to a newer one and
    # rewrite the baselines (visual-baselines.yml).
    - name: Start booting the iOS Simulator
      shell: bash
      env:
        SIM_MODEL: iPhone 17 Pro
      run: |
        # Captured first, so the step stops when the model is missing (a
        # process substitution's exit status would be lost).
        FOUND=$(xcrun simctl list devices available -j | python3 -c "
        import json, os, re, sys
        model = os.environ['SIM_MODEL']
        devices = json.load(sys.stdin)['devices']
        def version(runtime):
            return [int(n) for n in re.findall(r'\d+', runtime.split('iOS')[-1])]
        for runtime in sorted((r for r in devices if 'iOS' in r), key=version, reverse=True):
            for d in devices[runtime]:
                if d['name'] == model:
                    print(d['udid'], runtime.rsplit('.', 1)[-1])
                    sys.exit(0)
        print('no', model, 'on this runner; it has:', file=sys.stderr)
        for runtime, devs in devices.items():
            if 'iOS' in runtime:
                print(' ', runtime.rsplit('.', 1)[-1] + ':', ', '.join(d['name'] for d in devs), file=sys.stderr)
        sys.exit(1)
        ")
        read -r DEVICE RUNTIME <<< "$FOUND"
        echo "SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
        echo "Simulator: $SIM_MODEL, $RUNTIME" >> "$GITHUB_STEP_SUMMARY"
        echo "Booting $SIM_MODEL ($RUNTIME)"
        xcrun simctl boot "$DEVICE" 2>/dev/null || true

    # Maestro's latest release, cached under its version: every run tests
    # with the newest Maestro without downloading it each time (the install
    # took about 4.5 minutes). The install script fetches exactly that
    # version. If the release can't be looked up, it installs the latest
    # uncached rather than file it under no version.
    - name: Find Maestro's latest release
      id: maestro
      if: inputs.maestro == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=$(gh api repos/mobile-dev-inc/maestro/releases/latest --jq .tag_name || true)
        echo "version=${tag#cli-}" >> "$GITHUB_OUTPUT"

    - name: Restore Maestro
      id: maestro-cache
      if: inputs.maestro == 'true' && steps.maestro.outputs.version != ''
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.maestro/bin
          ~/.maestro/lib
        key: maestro-${{ runner.os }}-${{ runner.arch }}-${{ steps.maestro.outputs.version }}

    # Prints the version so every run records which Maestro it tested with.
    - name: Install Maestro
      if: inputs.maestro == 'true'
      shell: bash
      env:
        MAESTRO_VERSION: ${{ steps.maestro.outputs.version }}
        CACHED: ${{ steps.maestro-cache.outputs.cache-hit }}
      run: |
        if [ "$CACHED" != true ]; then
          curl -Ls "https://get.maestro.mobile.dev" | bash
        fi
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        "$HOME/.maestro/bin/maestro" --version

    - name: Save Maestro
      if: inputs.maestro == 'true' && steps.maestro.outputs.version != '' && steps.maestro-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: |
          ~/.maestro/bin
          ~/.maestro/lib
        key: maestro-${{ runner.os }}-${{ runner.arch }}-${{ steps.maestro.outputs.version }}

    - name: Restore the app
      id: app-cache
      uses: actions/cache/restore@v6
      with:
        path: build/e2e
        key: ${{ inputs.app-key }}

    # The build job saves the app to the cache; its artifact covers a save
    # that didn't land (two runs racing for the same key).
    - name: Take the build job's app
      if: steps.app-cache.outputs.cache-hit != 'true'
      uses: actions/download-artifact@v8
      with:
        name: sift-simulator-app
        path: build

    - name: Unpack the build job's app
      if: steps.app-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p build/e2e
        tar -xzf build/Sift-e2e.tar.gz -C build/e2e

    # Attaching the XCUITest driver to a half-booted simulator is the main
    # startup-flake source, so this blocks until SpringBoard is up.
    - name: Wait for the iOS Simulator to finish booting
      shell: bash
      run: xcrun simctl bootstatus "$SIM_UDID" -b

    # apsd, the simulator's Apple Push Service daemon, holds the connection
    # to Apple's push servers (APNs). On CI it can't, and retries with no
    # backoff: about 35 connection attempts a second, each with keychain and
    # certificate work, 150k-190k log lines a minute, for the whole job. It
    # ran through the slow runs on PR #211, where a touch reached the app up
    # to 6.5 s late and a screenshot pass and an E2E flow failed; the load
    # samples (machine-load.txt) show how much of the machine it took. Sift
    # uses no push notifications, so it's disabled (not restarted) and
    # stopped; the check after the warm-up says whether it stayed stopped.
    - name: Stop apsd, the simulator's push daemon
      shell: bash
      run: |
        before=$(xcrun simctl spawn booted log show --last 20s --style compact \
          --predicate 'process == "apsd"' 2>/dev/null | grep -c 'apsd\[' || true)
        date '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/apsd-stopped-at"
        xcrun simctl spawn booted launchctl disable system/com.apple.apsd || true
        xcrun simctl spawn booted launchctl bootout system/com.apple.apsd 2>/dev/null \
          || xcrun simctl spawn booted launchctl kill SIGKILL system/com.apple.apsd || true
        echo "apsd log lines in the 20 s before it was stopped: ${before:-0}"
        echo "${before:-0}" > "$RUNNER_TEMP/apsd-before"

    - name: Install app on simulator
      shell: bash
      run: xcrun simctl install booted build/e2e/*.app

    # One launch before the job's own, which then isn't the app's first on
    # this simulator: a first launch loads the baked JS bundle and warms the
    # dyld and simulator caches, and minutes after the runner booted it
    # stalled JavaScript for seconds (on PR #211 a tap reached it 3.9 s late,
    # then a 5 s stall, and the screenshot pass gave up on Setup). It waits
    # for the app to say Setup is up (its E2E trace line, persisted here as
    # scripts/app-trace.sh does) instead of a fixed sleep, up to a minute,
    # then quits it. Best effort: a warm-up hiccup never fails the job, and
    # each job's own launch resets or reinstalls the app.
    - name: Warm up the app (its first launch, before the job's)
      shell: bash
      continue-on-error: true
      run: |
        xcrun simctl spawn booted log config --subsystem com.facebook.react.log \
          --mode "level:info,persist:info" || true
        xcrun simctl launch booted com.jessicahirsh.sift || true
        start=$SECONDS
        ready=""
        while [ $((SECONDS - start)) -lt 60 ]; do
          if xcrun simctl spawn booted log show --info --last 2m --style compact \
            --predicate 'subsystem == "com.facebook.react.log" AND eventMessage CONTAINS "screen name=setup at=up"' 2>/dev/null \
            | grep -q 'screen name=setup at=up'; then
            ready=$((SECONDS - start))
            break
          fi
          sleep 1
        done
        if [ -n "$ready" ]; then
          echo "Setup was up within ${ready}s"
        else
          echo "::warning::The warm-up launch never reported Setup (no trace line in 60 s)."
        fi
        xcrun simctl terminate booted com.jessicahirsh.sift || true

    # Whether apsd stayed stopped through the install and warm-up, in the
    # job's summary: a loop that came back is a warning, not a failure.
    - name: Check apsd stayed stopped
      shell: bash
      run: |
        since=$(cat "$RUNNER_TEMP/apsd-stopped-at" 2>/dev/null || true)
        before=$(cat "$RUNNER_TEMP/apsd-before" 2>/dev/null || echo '?')
        after=$(xcrun simctl spawn booted log show --start "$since" --style compact \
          --predicate 'process == "apsd"' 2>/dev/null | grep -c 'apsd\[' || true)
        line="apsd log lines: ${before} in the 20 s before it was stopped, ${after:-0} since (from $since)"
        echo "$line"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"
        if [ "${after:-0}" -gt 100 ]; then
          echo "::warning::apsd is still logging (${after} lines since it was stopped): its reconnect loop may be back."
        fi
