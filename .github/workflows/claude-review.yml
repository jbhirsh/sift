# Claude Code PR review: jbhirsh/ci's review action (review/action.yml there
# says what it does, how it checks the review read every changed file, and
# what it leaves to this repo's other checks). This repo's part is in
# .github/ci.json ("review") and the guide it names,
# .github/claude-review.md, both read from main.
#
# Its own workflow, not a job in ci.yml, because claude-code-action skips
# (and still reports success) on any PR that edits the workflow file it runs
# from: only a PR that edits this stub skips review. It doesn't wait for CI,
# so a red PR is reviewed too; claude-autofix still works review threads only
# once CI is green as well. The job's `name:` is a required status check.
name: Claude Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    name: Claude Review
    # Fork PRs run without secrets, so the review only posts on same-repo
    # PRs. No paths filter: this is a required check and must report on
    # every PR.
    runs-on: ubuntu-latest
    # A full read of a big PR takes minutes, not hours; the default cap is 6 h.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: jbhirsh/ci/review@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
