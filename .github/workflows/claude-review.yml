# Claude Code PR review: jbhirsh/ci's review action (review/action.yml there
# says what it does, how it checks the review read every changed file, and
# what it leaves to this repo's other checks). This repo's part is in
# .github/ci.json ("review") and the guide it names,
# .github/claude-review.md, both read from main.
#
# Its own workflow, not a job in ci.yml, so it doesn't wait for CI: a red PR
# is reviewed too; claude-autofix still works review threads only once CI is
# green as well. The job's `name:` is a required status check.
name: Claude Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    name: Claude Review
    # Fork PRs get no OIDC token and a read-only token, so the review only
    # posts on same-repo PRs. No paths filter: this is a required check and must report on
    # every PR.
    runs-on: ubuntu-latest
    # A full read of a big PR takes minutes, not hours; the default cap is 6 h.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: jbhirsh/ci/review@main
        with:
          # Signs in by workload identity federation (the Anthropic Console's
          # Workload identity): the job's OIDC token for a short-lived Claude
          # API token, so the API sign-in needs no stored secret. These IDs
          # aren't secret.
          anthropic_federation_rule_id: fdrl_01BuwYpezaN3Vw9dbwvdF5JY
          anthropic_organization_id: 22970ab4-b9f2-4f4b-a7d7-d2e0bab4fcac
          anthropic_service_account_id: svac_01UZj2itXNdhewkTjp9Wv6YG
          anthropic_workspace_id: wrkspc_01GbH32ibMELoz7yNtpC8bB6
          # The owner's Claude subscription, which a pass the API refuses for
          # credit or a limit is retried on once (jbhirsh/ci#57). Without it a
          # stop isn't retried and fails the check. An Actions and a Dependabot
          # secret, since Dependabot's PRs see only the latter.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
