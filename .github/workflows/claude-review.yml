# Claude Code PR review. Its own workflow, not a job in ci.yml, because
# claude-code-action skips (and still reports success) on any PR that edits
# the workflow file it runs from: inside ci.yml, every CI change went
# unreviewed. Now only a PR that edits this file skips review.
#
# It no longer waits for CI, so a red PR is reviewed too. claude-autofix
# still works review threads only once CI is green as well.
name: Claude Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    name: Claude Review
    # On GitHub-hosted ubuntu; fork PRs run without secrets, so the review
    # only posts on same-repo PRs. No paths filter: this is a required check
    # and must report on every PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Let the AI review run on Dependabot's dependency-bump PRs. Without
          # this, claude-code-action refuses to run for the bot actor and fails
          # with "Workflow initiated by non-human actor: dependabot (type: Bot)".
          # claude[bot] pushes autofix's commits; without it the review fails
          # on them and, being required, blocks the PR. Allow-list just these
          # two trusted bots rather than "*".
          allowed_bots: "dependabot[bot],claude[bot]"
          prompt: |
            REPO_DIR: ${{ github.workspace }}
            PR: ${{ github.event.pull_request.number }}

            Review this pull request for correctness, bugs, and adherence to
            the project's engineering conventions. This is Sift, a React Native
            app (Expo SDK 57, RN 0.86, React 19, TypeScript strict, iOS only)
            for swiping through a music library (Apple Music via the
            `expo-musickit` native module in `modules/`, and Spotify). Read
            CLAUDE.md for the full architecture before reviewing.

            ## Code review focus

            Flag issues in these areas:
              - Logic errors and edge cases, especially in the reducer, the
                sorting utilities and the providers' paging and error paths.
              - Type safety and null/undefined handling (strict TypeScript).
              - React / React Native pitfalls (stale closures, effect deps,
                unnecessary re-renders, missing keys, listeners or timers that
                are never cleaned up).
              - Accessibility regressions in new UI (missing
                `accessibilityLabel` / `accessibilityRole` on touchables).

            ## Engineering conventions to enforce

            Treat violations of these as review issues and flag them inline:

            **Architecture:**
              - All app state lives in the single `SiftContext` reducer
                (`SiftState` / `SiftAction`). Flag a new external state library
                or app state held outside it.
              - Screens are switched by `state.phase` in `PhaseRouter`
                (`App.tsx`). Flag React Navigation or another router.
              - Music services implement `MusicProviderInterface`. Flag
                provider-specific calls made from screens or components instead
                of through the interface, and interface changes that
                `MockMusicProvider` doesn't follow.
              - Design values come from `src/theme/index.ts` (`SPACING`,
                `RADIUS`, `COLORS` via `useTheme()`, `SHADOWS`, `FONTS`,
                `GLASS`, `GRADIENTS`). Flag hard-coded spacing, radii, colours
                or font settings in components and screens.
              - Reuse components from `src/components/` rather than
                duplicating one. Icons use `expo-symbols` (`SymbolView`) on iOS.

            **Testing:**
              - Every new reducer action, service function or utility needs a
                unit test in `__tests__/unit/` (Jest). Flag one that ships
                without.
              - Every new user-facing flow needs a Maestro flow in `.maestro/`.
                Flag a new screen, phase or user flow without one.
              - Unit tests are pure logic, with no device rendering.
              - NEVER modify a test to make it pass. If a PR changes an
                assertion to match new (possibly-wrong) behavior instead of
                fixing the implementation, flag it.
              - E2E flows wait for elements (`extendedWaitUntil`) rather than
                asserting straight after an animated transition. Flag a retry or
                a fixed sleep added to paper over a flaky flow.

            **TypeScript / ESLint:**
              - All new code must be typed (strict mode).
              - A lint rule may only be relaxed by a narrow, file-scoped
                override in `eslint.config.mjs` with a comment saying why. Flag a
                rule turned off or downgraded globally.

            **Commit hygiene (inspect `git log` on the PR branch):**
              - CI's commit-message check (`.github/scripts/check-commits.sh`)
                already fails on subject length, a missing body, fixup or
                "oops" commits and merge commits; don't repeat those.
              - Each subject should be imperative ("Add X", not "Added X"),
                and the body should explain *why*, not *what*.
              - Commits authored with Claude should end with a
                `Co-Authored-By:` trailer.
              - A commit that patches an earlier commit on the branch (a
                debugging trail) should be squashed into it, whatever its
                subject says. CI/infra/workflow fixes are exempt.

            **Scope:**
              - The PR should do one thing. Flag unrelated refactors, drive-by
                formatting changes, or new abstractions the task doesn't need.
              - Don't add error handling or fallbacks for scenarios that can't
                happen.

            **Security / safety:**
              - Flag use of `git add -A` or `--no-verify` patterns if visible in
                commit messages or scripts.
              - DO NOT flag floating GitHub Action version tags (e.g. `@v5`,
                `@v1`) as a supply-chain risk or suggest pinning to commit SHAs.
                The maintainer has accepted this trade-off and prefers automatic
                patch/minor updates.

            ## Beyond the diff

            A change can break code it doesn't touch. When the PR changes a
            function's signature or behavior, a type, an exported constant, an
            API response, a storage key or a route, find every caller and reader
            (Grep the repo) and check each still works. Flag a breakage on the
            changed line and name the file it breaks.

            ## Stored data

            The app keeps state on the device that outlives an app update: the
            saved session (`SessionStore`, AsyncStorage key `sift_session`), the
            removal history (`RemovalHistoryStore`) and the Spotify tokens
            (SecureStore). Flag a change to a storage key or to the shape of a
            stored value (a renamed or removed field on `SiftSession` or a stored
            record) unless loading still accepts the old shape or migrates it;
            otherwise a user who updates mid-session loses it or crashes on load.

            ## New dependencies

            When `package.json` gains a runtime dependency (`dependencies`, not
            `devDependencies`), flag it if existing code, the platform or an
            already-installed package covers the need. This is about whether the
            package is needed at all; known vulnerabilities are checked elsewhere.

            ## Documentation drift

            The docs are the tracked Markdown files that describe the code as it
            is now (`git ls-files '*.md'`): README.md, CLAUDE.md and the like.
            Plans, changelogs and learnings logs record intent or history; leave
            those alone. Read the docs against the diff. A statement the PR makes
            false (a renamed file, function or component; a changed command,
            script, route, env var, default, limit or version; a moved test
            location; an architecture description that no longer holds) is a
            blocking issue:
              - If the PR's diff includes that line of the doc, put the inline
                comment on it with a GitHub suggestion block (a fenced block
                tagged `suggestion`) holding the corrected line(s), so it can be
                applied in one click.
              - Otherwise put the inline comment on the changed code line that
                made the doc wrong. Name the doc file and line, quote the stale
                text, and give the replacement text.
            Something the PR adds that the docs don't mention yet is not drift:
            note it in the top-level summary, not inline.

            ## Output format

            For every issue you find on a specific line, call the
            `mcp__github_inline_comment__create_inline_comment` tool to leave
            an inline comment anchored to that line. Do not summarize findings
            in a single top-level comment — use inline comments so each issue
            is anchored to the relevant code. Only use a top-level summary for
            overall impressions. Skip style nits already enforced by
            ESLint. Be concise.

            An inline comment is a merge blocker: Dependabot PRs merge
            automatically only once every review thread is resolved, and on
            them claude-autofix treats each thread as a bug to fix. Keep inline
            comments for problems that must be fixed before merge; put
            non-blocking notes (FYIs, "not a blocker", follow-up ideas) in the
            top-level summary instead.
          classify_inline_comments: "true"
          display_report: "true"
          show_full_output: "true"
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(gh:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"
