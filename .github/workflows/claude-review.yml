# Claude Code PR review. Its own workflow, not a job in ci.yml, because
# claude-code-action skips (and still reports success) on any PR that edits
# the workflow file it runs from: inside ci.yml, every CI change went
# unreviewed. Now only a PR that edits this file skips review.
#
# It no longer waits for CI, so a red PR is reviewed too. claude-autofix
# still works review threads only once CI is green as well.
name: Claude Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    name: Claude Review
    # On GitHub-hosted ubuntu; fork PRs run without secrets, so the review
    # only posts on same-repo PRs. No paths filter: this is a required check
    # and must report on every PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A full read of a big PR takes minutes, not hours; the default cap is 6 h.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Let the AI review run on Dependabot's dependency-bump PRs. Without
          # this, claude-code-action refuses to run for the bot actor and fails
          # with "Workflow initiated by non-human actor: dependabot (type: Bot)".
          # claude[bot] pushes autofix's commits; without it the review fails
          # on them and, being required, blocks the PR. Allow-list just these
          # two trusted bots rather than "*".
          allowed_bots: "dependabot[bot],claude[bot]"
          prompt: |
            REPO_DIR: ${{ github.workspace }}
            PR: ${{ github.event.pull_request.number }}

            Review this pull request for correctness, bugs, and adherence to
            the project's engineering conventions. This is Sift, a React Native
            app (Expo SDK 57, RN 0.86, React 19, TypeScript strict, iOS only)
            for swiping through a music library (Apple Music via the
            `expo-musickit` native module in `modules/`). Read CLAUDE.md for
            the full architecture before reviewing.

            ## Cover every changed file

            A review that passes a PR must have read all of its diff. Do this
            right after reading CLAUDE.md, however large the PR:
              1. See what changed and how much:
                 `git diff --stat -M origin/main...HEAD` and
                 `git diff --name-status -M origin/main...HEAD`. Lockfiles,
                 generated files and images may be skimmed or skipped; say
                 which in the summary. Every other file must be read in
                 full.
              2. Read each other file's diff on its own, tests included:
                 `git diff -M origin/main...HEAD -- <file>` (for a rename,
                 give both paths). Files under `__tests__/`, `.maestro/`
                 and `e2e/` are changed files like any other, and a changed
                 or removed assertion is where a weakened test hides.
                 Seeing a file only in `--stat` is not reading it. Don't
                 ask for several files in one command: large output is cut
                 to a preview. A check counts what you read from your own
                 tool calls, and only a plain command counts: no loop,
                 variable, pipe or `&&` chain (a leading `cd <dir> &&` is
                 fine); a file it can't see you read comes back to you in
                 a second pass. To save turns,
                 send several of these single-file diffs as parallel tool
                 calls in one message; each gets its own output limit.
              3. If a result comes back as "Output too large" with a path to
                 the full output, open that path with the Read tool (use
                 offset/limit for long ones) and read the rest before moving
                 on. A preview is not the diff.
              4. Keep a list of the files you've read.
            Only once every changed file is covered, read code outside the
            diff (callers, docs, tests) as the sections below ask.

            ## Code review focus

            Flag issues in these areas:
              - Logic errors and edge cases, especially in the reducer, the
                sorting utilities and the providers' paging and error paths.
              - Type safety and null/undefined handling (strict TypeScript).
              - React / React Native pitfalls (stale closures, effect deps,
                unnecessary re-renders, missing keys, listeners or timers that
                are never cleaned up).
              - Accessibility regressions in new UI (missing
                `accessibilityLabel` / `accessibilityRole` on touchables).

            ## Engineering conventions to enforce

            Treat violations of these as review issues and flag them inline:

            **Architecture:**
              - All app state lives in the single `SiftContext` reducer
                (`SiftState` / `SiftAction`). Flag a new external state library
                or app state held outside it.
              - Screens are switched by `state.phase` in `PhaseRouter`
                (`App.tsx`). Flag React Navigation or another router.
              - Music services implement `MusicProviderInterface`. Flag
                provider-specific calls made from screens or components instead
                of through the interface, and interface changes that
                `MockMusicProvider` doesn't follow.
              - Design values come from `src/theme/index.ts` (`SPACING`,
                `RADIUS`, `COLORS` via `useTheme()`, `SHADOWS`, `FONTS`,
                `GLASS`, `GRADIENTS`). Flag hard-coded spacing, radii, colours
                or font settings in components and screens.
              - Reuse components from `src/components/` rather than
                duplicating one. Icons use `expo-symbols` (`SymbolView`) on iOS.

            **Testing:**
              - Every new reducer action, service function or utility needs a
                unit test in `__tests__/unit/` (Jest). Flag one that ships
                without.
              - Every new user-facing flow needs a Maestro flow in `.maestro/`.
                Flag a new screen, phase or user flow without one.
              - Unit tests are pure logic, with no device rendering.
              - NEVER modify a test to make it pass. If a PR changes an
                assertion to match new (possibly-wrong) behavior instead of
                fixing the implementation, flag it.
              - E2E flows wait for elements (`extendedWaitUntil`) rather than
                asserting straight after an animated transition. Flag a retry or
                a fixed sleep added to paper over a flaky flow.

            **TypeScript / ESLint:**
              - All new code must be typed (strict mode).
              - A lint rule may only be relaxed by a narrow, file-scoped
                override in `eslint.config.mjs` with a comment saying why. Flag a
                rule turned off or downgraded globally.

            **Commit hygiene (inspect `git log` on the PR branch):**
              - CI's commit-message check (`.github/scripts/check-commits.sh`)
                already fails on subject length, a missing body, fixup or
                "oops" commits and merge commits; don't repeat those.
              - Each subject should be imperative ("Add X", not "Added X"),
                and the body should explain *why*, not *what*.
              - Commits authored with Claude should end with a
                `Co-Authored-By:` trailer.
              - A commit that patches an earlier commit on the branch (a
                debugging trail) should be squashed into it, whatever its
                subject says. CI/infra/workflow fixes are exempt.

            **Scope:**
              - The PR should do one thing. Flag unrelated refactors, drive-by
                formatting changes, or new abstractions the task doesn't need.
              - Don't add error handling or fallbacks for scenarios that can't
                happen.

            **Security / safety:**
              - Flag use of `git add -A` or `--no-verify` patterns if visible in
                commit messages or scripts.
              - DO NOT flag floating GitHub Action version tags (e.g. `@v5`,
                `@v1`) as a supply-chain risk or suggest pinning to commit SHAs.
                The maintainer has accepted this trade-off and prefers automatic
                patch/minor updates.

            ## Visual evidence

            Read the PR description (`gh pr view <number> --json body`). The
            "PR visuals" check already fails a UI change with no picture at
            all; your job is the judgment it can't make. If the diff changes how
            something on screen moves or responds (the card swipe or its spring
            back, a transition or animation, gesture handling, a sheet or modal
            opening or closing, scrolling, or a multi-step flow) and the
            description has no GIF or video (an image ending in `.gif`, a
            `<video>`, or a `github.com/user-attachments/assets/` link), leave
            an inline comment on the main changed line asking for before/after
            GIFs. Still screenshots are enough for changes to how things look.

            ## Beyond the diff

            A change can break code it doesn't touch. When the PR changes a
            function's signature or behavior, a type, an exported constant, an
            API response, a storage key or a route, find every caller and reader
            (Grep the repo) and check each still works. Flag a breakage on the
            changed line and name the file it breaks.

            ## Stored data

            The app keeps state on the device that outlives an app update: the
            saved session (`SessionStore`: the compact record `sift_session_v2`
            and its track-list slots, plus the older `sift_session` blob), the
            removal history (`RemovalHistoryStore`), the reviewed ledger
            (`ReviewedLedgerStore`), preferences (`PreferencesStore`) and the
            other `sift_*` keys under `src/services/`. Flag a change to a
            storage key or to the shape of a stored value (a renamed or removed
            field on `SiftSession` or a stored record) unless loading still
            accepts the old shape or migrates it; otherwise a user who updates
            mid-session loses it or crashes on load. A new saved session shape
            needs a new frozen fixture in `__tests__/fixtures/sessions`.

            ## New dependencies

            When `package.json` gains a runtime dependency (`dependencies`, not
            `devDependencies`), flag it if existing code, the platform or an
            already-installed package covers the need. This is about whether the
            package is needed at all; known vulnerabilities are checked elsewhere.

            ## Documentation drift

            The docs are the tracked Markdown files that describe the code as it
            is now (`git ls-files '*.md'`): README.md, CLAUDE.md and the like.
            Plans, changelogs and learnings logs record intent or history; leave
            those alone. Read the docs against the diff. A statement the PR makes
            false (a renamed file, function or component; a changed command,
            script, route, env var, default, limit or version; a moved test
            location; an architecture description that no longer holds) is a
            blocking issue:
              - If the PR's diff includes that line of the doc, put the inline
                comment on it with a GitHub suggestion block (a fenced block
                tagged `suggestion`) holding the corrected line(s), so it can be
                applied in one click.
              - Otherwise put the inline comment on the changed code line that
                made the doc wrong. Name the doc file and line, quote the stale
                text, and give the replacement text.
            Something the PR adds that the docs don't mention yet is not drift:
            note it in the top-level summary, not inline.

            ## Output format

            For every issue you find on a specific line, call the
            `mcp__github_inline_comment__create_inline_comment` tool to leave
            an inline comment anchored to that line. Do not summarize findings
            in a single top-level comment — use inline comments so each issue
            is anchored to the relevant code. Everything else goes in the
            summary comment (see Summary comment). Skip style nits already
            enforced by ESLint. Be concise.

            An inline comment is a merge blocker: Dependabot PRs merge
            automatically only once every review thread is resolved, and on
            them claude-autofix treats each thread as a bug to fix. Keep inline
            comments for problems that must be fixed before merge; put
            non-blocking notes (FYIs, "not a blocker", follow-up ideas) in the
            top-level summary instead.

            ## Summary comment

            Finish by posting the top-level summary as one PR comment, so a
            pass shows on the PR what was checked. Its body starts with the
            line `<!-- claude-review-summary -->` and then gives, briefly:
              - the verdict (merge blockers found or not, and how many inline
                comments you left);
              - the files you read, and any you skimmed or skipped and why
                (group them by directory when there are many). A file seen
                only in `--stat`, or only in part, counts as skimmed; say
                "nothing skipped" only when every changed file other than
                lockfiles, generated files and images was read in full;
              - the non-blocking notes.
            Keep a single summary per PR, updated on each push. Find yours
            (posted as `claude[bot]`) with
            `gh api repos/${{ github.repository }}/issues/<PR>/comments --paginate --jq '.[] | select(.user.login == "claude[bot]" and (.body | startswith("<!-- claude-review-summary -->"))) | .id'`.
            Pass the body on stdin through a quoted heredoc, never inside a
            quoted argument (backticks and `$` in it would be run by the
            shell). If an id came back, replace that comment:
            `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -F body=@- <<'EOF'`,
            then the body, then a line holding only `EOF`. Otherwise create
            it the same way with
            `gh api repos/${{ github.repository }}/issues/<PR>/comments -F body=@- <<'EOF'`.
            This comment is not a review thread and blocks nothing.
          classify_inline_comments: "true"
          display_report: "true"
          show_full_output: "true"
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Grep,Glob,Bash(gh:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"

      # The prompt says to read every changed file's diff, tests included,
      # yet a review passed #188 twice having seen its tests only in
      # `--stat`. scripts/review-coverage.mjs reads the review's own tool
      # calls and lists the changed files it never read (lockfiles and
      # images aside); those go back to a second pass, and a file still
      # unread after it fails the check. No execution file means the action
      # skipped (a PR that edits this file): nothing to check.
      - uses: actions/setup-node@v7
        if: steps.review.outputs.execution_file != ''
        with:
          node-version: 24

      - name: Check the review read every changed file
        id: coverage
        if: steps.review.outputs.execution_file != ''
        env:
          REPO_DIR: ${{ github.workspace }}
        run: |
          set -o pipefail
          # The follow-up writes its log to the same path.
          cp "${{ steps.review.outputs.execution_file }}" "$RUNNER_TEMP/review-pass-1.json"
          git -c core.quotePath=false diff --name-only -M origin/main...HEAD \
            | node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/review-coverage.mjs "$RUNNER_TEMP/review-pass-1.json" \
            > "$RUNNER_TEMP/unread.txt"
          if [ -s "$RUNNER_TEMP/unread.txt" ]; then
            echo "The review didn't read:"
            cat "$RUNNER_TEMP/unread.txt"
            {
              echo 'unread<<UNREAD_EOF'
              sed 's/^/  - /' "$RUNNER_TEMP/unread.txt"
              echo 'UNREAD_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "The review read every changed file."
          fi

      - uses: anthropics/claude-code-action@v1
        id: followup
        if: steps.coverage.outputs.unread != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot],claude[bot]"
          prompt: |
            REPO_DIR: ${{ github.workspace }}
            PR: ${{ github.event.pull_request.number }}

            A review of this pull request just finished without reading
            these changed files' diffs:
            ${{ steps.coverage.outputs.unread }}

            Read CLAUDE.md, then read each of those diffs in full, one file
            per command, exactly `git diff -M origin/main...HEAD -- <file>`:
            no loop, variable, pipe or `&&` chain, or the check that sent
            you here can't see that you read it, and the job fails. If a
            result comes back as "Output too large" with a path to the full
            output, open that path with the Read tool and read all of it
            (offset/limit for a long one). Review them as the first pass did the
            rest: correctness, the conventions in CLAUDE.md, and in tests a
            changed or removed assertion (never modify a test to make it
            pass), a weakened check, a fixture edited rather than added.
            For each problem that must be fixed before merge, leave an
            inline comment with
            `mcp__github_inline_comment__create_inline_comment`.

            Then update the review's summary comment: find it with
            `gh api repos/${{ github.repository }}/issues/<PR>/comments --paginate --jq '.[] | select(.user.login == "claude[bot]" and (.body | startswith("<!-- claude-review-summary -->"))) | .id'`
            and replace it with
            `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -F body=@- <<'EOF'`,
            the body, then a line holding only `EOF`. Keep its first line
            and everything still true; move these files from skimmed to
            read, and add what you found (or that you found nothing).
          classify_inline_comments: "true"
          display_report: "true"
          show_full_output: "true"
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Grep,Glob,Bash(gh:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"

      - name: Fail if files are still unread
        if: steps.coverage.outputs.unread != ''
        env:
          REPO_DIR: ${{ github.workspace }}
        run: |
          set -o pipefail
          passes=("$RUNNER_TEMP/review-pass-1.json")
          if [ -n "${{ steps.followup.outputs.execution_file }}" ]; then
            passes+=("${{ steps.followup.outputs.execution_file }}")
          fi
          unread=$(git -c core.quotePath=false diff --name-only -M origin/main...HEAD \
            | node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/review-coverage.mjs "${passes[@]}")
          if [ -n "$unread" ]; then
            while IFS= read -r file; do
              echo "::error file=$file::Claude Review never read this file's diff, even on a second pass."
            done <<< "$unread"
            exit 1
          fi
          echo "The follow-up read the rest."
