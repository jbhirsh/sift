name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Lint, Typecheck & Unit Test
    runs-on: ubuntu-latest
    # pull-requests: read for paths-filter and the commit-message check.
    permissions:
      contents: read
      pull-requests: read
    # Expose whether any non-docs file changed so the expensive macOS `e2e`
    # job below can skip docs-only PRs. Kept as a step in this existing job
    # (not a separate job) so it adds no extra status check — and because
    # `check` itself always runs, the required check is never left pending on a
    # docs-only PR the way a workflow-level `paths-ignore` did.
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v7

      - name: Commit messages
        # Subject length, body, fixup and merge-commit rules from CLAUDE.md.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/check-commits.sh

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!.github/**/*.md'
              - '!LICENSE'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency graph
        run: npx depcruise src

      - name: Test with coverage
        run: npx jest --coverage

      - name: Expo Doctor
        run: npx expo-doctor@latest
        continue-on-error: true

  e2e:
    name: E2E Tests (Maestro)
    needs: check
    # Skip the ~30-min macOS build on docs-only changes (the required `check`
    # still runs and gates the merge). Always runs on manual dispatch.
    if: needs.check.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    # Runs on GitHub-hosted macOS (free on public repos) on every PR and push
    # to main. A cold run rebuilds the simulator app (~20-30 min); warm runs
    # restore it from actions/cache keyed on the project fingerprint, or reuse
    # the ios-build artifact for the same head SHA (~1 min).
    # Caveat: the build step needs EXPO_TOKEN, which dependabot-triggered PRs
    # don't receive (they read Dependabot secrets, not Actions secrets) — on a
    # cache miss those PRs fail here until the token is mirrored into
    # Dependabot secrets.
    # Pinned (not macos-latest) so a runner-image migration can't silently
    # change simulator/Xcode behavior; bump deliberately. macos-26 is the
    # image the working builds resolve to (Xcode 26; Expo SDK 57 requires
    # >=26 — macos-15's default Xcode 16.4 cannot compile expo-modules-core).
    runs-on: macos-26
    # Cold path: ~10 min setup + ~30 min build + the Maestro step's own
    # 40-min cap below. The step cap must expire before this one: a JOB
    # timeout counts as cancellation, which skips the failure()/!cancelled()
    # diagnostics and upload steps and loses all evidence.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Compute project fingerprint
        id: fingerprint
        run: |
          NATIVE=$(npx expo-updates fingerprint:generate --platform ios 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['hash'])")
          SOURCE=$(find src __tests__ -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          FINGERPRINT="${NATIVE}-${SOURCE}"
          echo "hash=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "Fingerprint: $FINGERPRINT"

      - name: Restore build cache
        id: build-cache
        uses: actions/cache@v6
        with:
          path: build/e2e
          key: sift-e2e-${{ steps.fingerprint.outputs.hash }}

      # The ios-build job builds the identical e2e-simulator profile on PR CI
      # and uploads it; reusing that artifact turns a ~30-minute cold rebuild
      # into a ~1-minute download whenever this head already built there.
      - name: Reuse ios-build artifact if available
        id: reuse
        if: steps.build-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/ios-build.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "${{ github.repository }}" --name sift-simulator-app --dir build/; then
            mkdir -p build/e2e
            tar -xzf build/Sift-e2e.tar.gz -C build/e2e
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Reused simulator app from ios-build run $run_id"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No reusable ios-build artifact for this sha — building."
          fi

      - name: Build simulator app
        if: steps.build-cache.outputs.cache-hit != 'true' && steps.reuse.outputs.hit != 'true'
        run: eas build --profile e2e-simulator --platform ios --local --non-interactive --output build/Sift-e2e.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          USE_CCACHE: '1'

      - name: Extract build
        if: steps.build-cache.outputs.cache-hit != 'true' && steps.reuse.outputs.hit != 'true'
        run: |
          mkdir -p build/e2e
          tar -xzf build/Sift-e2e.tar.gz -C build/e2e

      # Prints the resolved version so every run records which Maestro it
      # tested with (previously never logged, so drift was undetectable).
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Boot iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
              if 'iOS' in runtime:
                  for d in devs:
                      if 'iPhone' in d['name']:
                          print(d['udid'])
                          sys.exit(0)
          ")
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          # Block until SpringBoard is actually up — attaching the XCUITest
          # driver to a half-booted simulator is the main startup-flake source.
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Install app on simulator
        run: xcrun simctl install booted build/e2e/*.app

      # Warm the app before the suite runs. A plain
      # launch + settle + terminate loads the baked JS bundle and warms the
      # dyld/simulator caches, cutting the cold-start latency the flake
      # clusters on. Best effort — a warmup hiccup must never fail the job,
      # and the first real flow's clearState wipes any residual state.
      - name: Warm up the app (prime caches before the suite)
        run: |
          xcrun simctl launch booted com.jessicahirsh.sift || true
          sleep 25
          xcrun simctl terminate booted com.jessicahirsh.sift || true

      - name: Run Maestro tests
        # A step timeout counts as a failure (not a cancellation), so the
        # diagnostics and artifact upload below still run. run-e2e.sh also
        # fails fast when the driver is down rather than timing out per flow.
        timeout-minutes: 40
        env:
          # GitHub-hosted macOS runners can be slow enough that the XCUITest
          # driver misses Maestro's default startup window (seen as
          # IOSDriverTimeoutException in run 29703273714). Give it 5 minutes.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          # No analytics network call — one less nondeterministic dependency.
          MAESTRO_CLI_NO_ANALYTICS: "1"
          E2E_OUT_DIR: maestro-results
        # The whole suite runs in one session; then only the flows that died
        # of a driver/transport error are re-run alone on a fresh driver, so
        # one driver death can't cascade into every remaining flow (main run
        # 34544916181: 1 driver crash -> 11/11 failed). App-level failures
        # (assertions, missing elements) are NEVER retried; each re-run is
        # annotated as a warning. See scripts/run-e2e.sh for the policy.
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          scripts/run-e2e.sh .maestro

      # Failure-only extras on top of run-e2e.sh's per-flow logs: where
      # Maestro wrote its own output, a simulator log tail, and a screenshot
      # of whatever screen was up. Diagnostics must never themselves fail —
      # every command here is guarded.
      - name: Locate Maestro output (diagnostics)
        if: failure()
        run: |
          mkdir -p maestro-results
          {
            echo "=== CWD candidates ==="
            find . -maxdepth 2 \( -name 'maestro-*' -o -name '*.png' -o -name 'debug*' \) -not -path './node_modules/*' 2>/dev/null | head -20 || true
            echo "=== HOME/.maestro ==="
            find "$HOME/.maestro" -maxdepth 3 2>/dev/null | head -30 || true
            echo "=== per-flow results ==="
            ls -la maestro-results 2>/dev/null || true
          } 2>&1 | tee maestro-results/diagnostics.txt || true
          xcrun simctl spawn booted log show --style compact --last 10m 2>/dev/null | tail -300 > maestro-results/simulator-log-tail.txt || true
          # Which SCREEN was up when the wait timed out? Everything above proves
          # the app is alive but not WHERE it was — a 30s card-wait timeout
          # looks identical whether we stalled on Loading (a real stall) or were
          # already on Sifting with the element merely unseen (transition flake).
          # A screenshot disambiguates the two and is captured straight off the
          # simulator, so it works regardless of Maestro's debug-output quirks
          # and guarantees the artifact is non-empty on any in-flow failure.
          xcrun simctl io booted screenshot maestro-results/failure-screenshot.png || true
          # Maestro writes per-flow screenshots + view hierarchies (its XCUITest
          # accessibility snapshot) on failure, but the directory varies by
          # version; copy whatever landed under ~/.maestro/tests into the folder
          # so the UI hierarchy at the point of failure travels with the shot.
          cp -R "$HOME/.maestro/tests" maestro-results/maestro-tests 2>/dev/null || true

      # Uploaded on success too: a run that passed only after a driver retry
      # still carries the failed attempt's log, which is the evidence needed
      # to chase the infra flake down instead of shrugging it off.
      - name: Upload Maestro results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          # Per-flow logs + JUnit + debug output from scripts/run-e2e.sh, plus
          # ~/.maestro/tests (where some Maestro versions write screenshots and
          # view hierarchies regardless of --debug-output). run-e2e.sh always
          # writes a log per flow, so an empty artifact means the job broke
          # before the suite ran — fail loudly rather than upload nothing.
          path: |
            maestro-results
            ~/.maestro/tests
            ~/.maestro/**/*.png
          if-no-files-found: error
          retention-days: 7

  review:
    name: Claude Review
    needs: check
    # Runs as a dependent CI job on pull requests (after `check` passes) rather
    # than as a separate workflow_run workflow. On GitHub-hosted ubuntu; fork
    # PRs run without secrets, so the review only posts on same-repo PRs.
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Let the AI review run on Dependabot's dependency-bump PRs. Without
          # this, claude-code-action refuses to run for the bot actor and fails
          # with "Workflow initiated by non-human actor: dependabot (type: Bot)".
          # claude[bot] pushes autofix's commits; without it the review fails
          # on them and, being required, blocks the PR. Allow-list just these
          # two trusted bots rather than "*".
          allowed_bots: "dependabot[bot],claude[bot]"
          prompt: |
            REPO_DIR: ${{ github.workspace }}
            PR: ${{ github.event.pull_request.number }}

            Review this pull request for correctness, bugs, and adherence to
            the project's engineering conventions. This is Sift, a React Native
            app (Expo SDK 57, RN 0.86, React 19, TypeScript strict, iOS only)
            for swiping through a music library (Apple Music via the
            `expo-musickit` native module in `modules/`, and Spotify). Read
            CLAUDE.md for the full architecture before reviewing.

            ## Code review focus

            Flag issues in these areas:
              - Logic errors and edge cases, especially in the reducer, the
                sorting utilities and the providers' paging and error paths.
              - Type safety and null/undefined handling (strict TypeScript).
              - React / React Native pitfalls (stale closures, effect deps,
                unnecessary re-renders, missing keys, listeners or timers that
                are never cleaned up).
              - Accessibility regressions in new UI (missing
                `accessibilityLabel` / `accessibilityRole` on touchables).

            ## Engineering conventions to enforce

            Treat violations of these as review issues and flag them inline:

            **Architecture:**
              - All app state lives in the single `SiftContext` reducer
                (`SiftState` / `SiftAction`). Flag a new external state library
                or app state held outside it.
              - Screens are switched by `state.phase` in `PhaseRouter`
                (`App.tsx`). Flag React Navigation or another router.
              - Music services implement `MusicProviderInterface`. Flag
                provider-specific calls made from screens or components instead
                of through the interface, and interface changes that
                `MockMusicProvider` doesn't follow.
              - Design values come from `src/theme/index.ts` (`SPACING`,
                `RADIUS`, `COLORS` via `useTheme()`, `SHADOWS`, `FONTS`,
                `GLASS`, `GRADIENTS`). Flag hard-coded spacing, radii, colours
                or font settings in components and screens.
              - Reuse components from `src/components/` rather than
                duplicating one. Icons use `expo-symbols` (`SymbolView`) on iOS.

            **Testing:**
              - Every new reducer action, service function or utility needs a
                unit test in `__tests__/unit/` (Jest). Flag one that ships
                without.
              - Every new user-facing flow needs a Maestro flow in `.maestro/`.
                Flag a new screen, phase or user flow without one.
              - Unit tests are pure logic, with no device rendering.
              - NEVER modify a test to make it pass. If a PR changes an
                assertion to match new (possibly-wrong) behavior instead of
                fixing the implementation, flag it.
              - E2E flows wait for elements (`extendedWaitUntil`) rather than
                asserting straight after an animated transition. Flag a retry or
                a fixed sleep added to paper over a flaky flow.

            **TypeScript / ESLint:**
              - All new code must be typed (strict mode).
              - A lint rule may only be relaxed by a narrow, file-scoped
                override in `eslint.config.mjs` with a comment saying why. Flag a
                rule turned off or downgraded globally.

            **Commit hygiene (inspect `git log` on the PR branch):**
              - CI's commit-message check (`.github/scripts/check-commits.sh`)
                already fails on subject length, a missing body, fixup or
                "oops" commits and merge commits; don't repeat those.
              - Each subject should be imperative ("Add X", not "Added X"),
                and the body should explain *why*, not *what*.
              - Commits authored with Claude should end with a
                `Co-Authored-By:` trailer.
              - A commit that patches an earlier commit on the branch (a
                debugging trail) should be squashed into it, whatever its
                subject says. CI/infra/workflow fixes are exempt.

            **Scope:**
              - The PR should do one thing. Flag unrelated refactors, drive-by
                formatting changes, or new abstractions the task doesn't need.
              - Don't add error handling or fallbacks for scenarios that can't
                happen.

            **Security / safety:**
              - Flag use of `git add -A` or `--no-verify` patterns if visible in
                commit messages or scripts.
              - DO NOT flag floating GitHub Action version tags (e.g. `@v5`,
                `@v1`) as a supply-chain risk or suggest pinning to commit SHAs.
                The maintainer has accepted this trade-off and prefers automatic
                patch/minor updates.

            ## Beyond the diff

            A change can break code it doesn't touch. When the PR changes a
            function's signature or behavior, a type, an exported constant, an
            API response, a storage key or a route, find every caller and reader
            (Grep the repo) and check each still works. Flag a breakage on the
            changed line and name the file it breaks.

            ## Stored data

            The app keeps state on the device that outlives an app update: the
            saved session (`SessionStore`, AsyncStorage key `sift_session`), the
            removal history (`RemovalHistoryStore`) and the Spotify tokens
            (SecureStore). Flag a change to a storage key or to the shape of a
            stored value (a renamed or removed field on `SiftSession` or a stored
            record) unless loading still accepts the old shape or migrates it;
            otherwise a user who updates mid-session loses it or crashes on load.

            ## New dependencies

            When `package.json` gains a runtime dependency (`dependencies`, not
            `devDependencies`), flag it if existing code, the platform or an
            already-installed package covers the need. This is about whether the
            package is needed at all; known vulnerabilities are checked elsewhere.

            ## Documentation drift

            The docs are the tracked Markdown files that describe the code as it
            is now (`git ls-files '*.md'`): README.md, CLAUDE.md and the like.
            Plans, changelogs and learnings logs record intent or history; leave
            those alone. Read the docs against the diff. A statement the PR makes
            false (a renamed file, function or component; a changed command,
            script, route, env var, default, limit or version; a moved test
            location; an architecture description that no longer holds) is a
            blocking issue:
              - If the PR's diff includes that line of the doc, put the inline
                comment on it with a GitHub suggestion block (a fenced block
                tagged `suggestion`) holding the corrected line(s), so it can be
                applied in one click.
              - Otherwise put the inline comment on the changed code line that
                made the doc wrong. Name the doc file and line, quote the stale
                text, and give the replacement text.
            Something the PR adds that the docs don't mention yet is not drift:
            note it in the top-level summary, not inline.

            ## Output format

            For every issue you find on a specific line, call the
            `mcp__github_inline_comment__create_inline_comment` tool to leave
            an inline comment anchored to that line. Do not summarize findings
            in a single top-level comment — use inline comments so each issue
            is anchored to the relevant code. Only use a top-level summary for
            overall impressions. Skip style nits already enforced by
            ESLint. Be concise.

            An inline comment is a merge blocker: Dependabot PRs merge
            automatically only once every review thread is resolved, and on
            them claude-autofix treats each thread as a bug to fix. Keep inline
            comments for problems that must be fixed before merge; put
            non-blocking notes (FYIs, "not a blocker", follow-up ideas) in the
            top-level summary instead.
          classify_inline_comments: "true"
          display_report: "true"
          show_full_output: "true"
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(gh:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"
