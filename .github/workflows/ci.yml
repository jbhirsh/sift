name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # For a PR's "before" GIFs (scripts/pr-gifs.mjs): run on main with
      # the PR's scenarios, recording only.
      gifs_only:
        description: Only record the GIF scenarios (no suite, audit or screenshots)
        type: boolean
        default: false
      gif_scenarios_from:
        description: Commit whose e2e/gifs to record (empty for this run's own)
        type: string
        default: ''
      without_expo_login:
        description: Build the simulator app as a Dependabot PR does, with no Expo login (prebuild + xcodebuild)
        type: boolean
        default: false

# A gifs-only run by hand (a PR's "before" GIFs, scripts/pr-gifs.mjs) gets
# a group of its own: sharing main's, it would cancel main's push run (which
# saves the app cache PRs reuse), be cancelled by the next merge, and cancel
# another PR's GIF run.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.gifs_only == true && format('gifs-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Lint, Typecheck & Unit Test
    runs-on: ubuntu-latest
    # A hung step fails in minutes, not after GitHub's six-hour default.
    timeout-minutes: 20
    # pull-requests: read for paths-filter and the commit-message check.
    permissions:
      contents: read
      pull-requests: read
    # Expose whether anything that can affect the app or the simulator jobs
    # changed, so the expensive macOS jobs below can skip PRs that only touch
    # docs or repo tooling. Kept as a step in this existing job
    # (not a separate job) so it adds no extra status check — and because
    # `check` itself always runs, the required check is never left pending on a
    # skipped PR the way a workflow-level `paths-ignore` did.
    outputs:
      code: ${{ steps.filter.outputs.code }}
      app_key: ${{ steps.app-key.outputs.key }}
      app_cached: ${{ steps.app-cache.outputs.cache-hit }}

    steps:
      - uses: actions/checkout@v7

      # Subject length, body, fixup and merge-commit rules (jbhirsh/ci).
      - name: Commit messages
        if: github.event_name == 'pull_request'
        uses: jbhirsh/ci/commits@main

      # `every`: a file counts as code only if it matches every pattern, so
      # each `!` pattern excludes. (The default, `some`, lets '**' match
      # everything, which made the exclusions dead.) Excluded: docs, repo
      # config (the formatter's, the audits' and type coverage's included),
      # and tooling that can't change the app or this job: other
      # workflows (ci.yml is this job), CI
      # helpers, and scripts/ apart from the simulator jobs' runners (suite,
      # audit, screenshots, GIFs).
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/*'
              - '!.github/workflows/!(ci).yml'
              - '!scripts/!(run-e2e.sh|run-a11y-audit.sh|take-screenshots.sh|take-gifs.sh|build-simulator-app.sh|app-trace.sh|build-a11y-audit.sh)'
              - '!stryker.config.json'
              - '!.prettierrc.json'
              - '!.prettierignore'
              - '!.git-blame-ignore-revs'
              - '!knip.jsonc'
              - '!.jscpd.json'
              - '!.lycheeignore'
              - '!tsconfig.typecov.json'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The app's cache key, worked out here where node_modules already is,
      # so the simulator jobs install nothing to look their app up. The
      # native fingerprint, plus the bundle's inputs: src/, the entry point,
      # the Metro config, the lockfile (a JavaScript-only package isn't in
      # the native fingerprint, and a bump of one must rebuild, not test
      # main's old bundle), .env (its EXPO_UNSTABLE_* flags change the
      # bundle) and the bundled assets. Tests and Maestro flows aren't in the
      # app, so a test-only change mustn't force a rebuild. Ubuntu's hash
      # needn't match a Mac's: this job makes the key both where the app is
      # saved and where it's looked up.
      - name: App cache key
        id: app-key
        run: |
          NATIVE=$(npx expo-updates fingerprint:generate --platform ios 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['hash'])")
          SOURCE=$( (find src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print0; find assets -type f -print0; printf '%s\0' index.ts metro.config.js package-lock.json .env) | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "key=sift-e2e-${NATIVE}-${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "App cache key: sift-e2e-${NATIVE}-${SOURCE}"

      # Whether the app is cached already, which decides whether the build
      # job builds. Linux and macOS file caches under the same version
      # (actions/cache sets Windows apart only), so this lookup finds what
      # the macOS build job saved.
      - name: Is the app cached?
        id: app-cache
        uses: actions/cache/restore@v6
        with:
          path: build/e2e
          key: ${{ steps.app-key.outputs.key }}
          lookup-only: true

      - name: Autofix triggers
        # Every pull-request workflow must wake Claude autofix or be exempt
        # in .github/ci.json (jbhirsh/ci's autofix/check-triggers.mjs says
        # why), so a new one can't be left out of claude-autofix.yml.
        if: github.event_name == 'pull_request'
        uses: jbhirsh/ci/autofix/check-triggers@main

      - name: Pins
        # A version held below its major needs a reason beside it (jbhirsh/ci's
        # pins/check.mjs says what counts; Expo's SDK is the reason for the
        # versions it chooses, read from node_modules, hence after npm ci).
        uses: jbhirsh/ci/pins@main

      # The package scripts, so a clean pre-commit hook means a clean CI.
      - name: Lint
        run: npm run lint

      # Prettier over the whole tree (.prettierrc.json, .prettierignore).
      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # No `any` anywhere in the app code (src, the native module's
      # TypeScript, scripts/*.ts: tsconfig.typecov.json): type-coverage must
      # find every expression typed (package.json "typeCoverage"). Its strict
      # figure, which also counts `as` casts, non-null assertions and `any`
      # inside generics, goes in the summary for information only.
      - name: Type coverage
        run: |
          npm run -s typecov
          strict=$(npm run -s typecov:strict | grep -o '[0-9.]*%' | tail -1)
          echo "Strict type coverage (information only): $strict" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dependency graph
        run: npm run depcruise

      - name: Native bridge
        # Keeps modules/expo-musickit thin: every native function is listed
        # in native-api.json, Swift and TypeScript surfaces match, and size
        # budgets hold (scripts/nativeBridge.ts).
        run: npm run bridge

      - name: Test with coverage
        run: npx jest --coverage

      - name: Expo Doctor
        run: npx expo-doctor@latest
        continue-on-error: true

      # Fail the PR on known critical vulnerabilities in production deps.
      # Critical, not high like the web repos: Expo's own build tooling
      # (@expo/cli, node-forge, image-size) carries high advisories whose
      # only npm "fix" is a downgrade to an ancient Expo, so a high gate
      # would be permanently red over code that doesn't ship in the app.
      # Dependabot picks up Expo's fixes on its weekly run.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # Which native-affecting files a PR changed: the build job below runs only
  # for those. A step of its own job, not a trigger-level paths filter: a
  # filtered-out workflow never reports, which would leave the required
  # build check hanging at "Expected"; a job skipped by its `if:` passes it.
  changes:
    name: Detect native changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - 'modules/**'
              - 'app.json'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'scripts/build-simulator-app.sh'

  # The only job that builds the app. It's the compile gate for the native
  # code (lint, typecheck and Jest never touch the Swift in
  # modules/expo-musickit, so this is the only check that proves it still
  # compiles; free on a public repo's macOS runners), so it builds whenever
  # a PR changes native files, and otherwise whenever the app isn't cached
  # (a JavaScript change; on main, so PRs can restore it). It saves the app
  # to the cache and as an artifact. The simulator jobs `needs:` this one,
  # so while it builds they wait, not started, and then they only restore.
  build:
    name: Build iOS simulator app
    needs: [changes, check]
    # It waits for the whole `check` job (about a minute and a half), for
    # the app's key and whether it's cached, but not for check to pass:
    # `!cancelled()` runs it after a red check too, so a lint failure
    # doesn't hide a compile error (and `changes` runs only on PRs, a
    # skipped dependency that would otherwise skip this). Fail-safe: if
    # change detection itself errored, build anyway, as a skipped job reads
    # as a passing check. A docs-only PR builds nothing.
    if: >-
      ${{ !cancelled() && needs.check.outputs.app_key != '' && (
        needs.changes.result == 'failure' || needs.changes.outputs.native == 'true' ||
        inputs.without_expo_login == true ||
        (needs.check.outputs.app_cached != 'true' && (needs.check.outputs.code == 'true' || github.event_name != 'pull_request'))
      ) }}
    # The same image as the e2e job, which installs this build.
    runs-on: macos-26
    # A cold build takes about 30 minutes; without a limit a stuck one would
    # hold a macOS runner for GitHub's 6-hour default.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Only the eas path needs the EAS CLI.
      - name: Setup EAS CLI
        if: env.HAS_EXPO_TOKEN == 'true' && inputs.without_expo_login != true
        run: npm install -g eas-cli

      # Every PR really builds, Dependabot's included (#178): its runs get no
      # Actions secrets, so without EXPO_TOKEN the script builds the same
      # e2e-simulator app with no Expo or Apple login (expo prebuild +
      # xcodebuild). A run by hand with without_expo_login takes that path
      # on purpose, to check it. Without SENTRY_AUTH_TOKEN the source-map
      # upload is turned off rather than the build skipped.
      - name: Build simulator app (compiles expo-musickit Swift)
        run: scripts/build-simulator-app.sh build/Sift-e2e.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SIFT_BUILD_WITHOUT_EXPO: ${{ inputs.without_expo_login == true && '1' || '' }}
          USE_CCACHE: '1'

      # For this run's simulator jobs, in case the cache save below loses a
      # race with another run's.
      - uses: actions/upload-artifact@v7
        with:
          name: sift-simulator-app
          path: build/Sift-e2e.tar.gz
          retention-days: 7

      # Under the check job's key, for this run's simulator jobs and later
      # runs. A build of an app already cached (a native PR's compile check
      # of an unchanged tree) has nothing new to save.
      - name: Unpack the app for the cache
        if: needs.check.outputs.app_cached != 'true'
        run: |
          mkdir -p build/e2e
          tar -xzf build/Sift-e2e.tar.gz -C build/e2e

      - name: Save the app
        if: needs.check.outputs.app_cached != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: build/e2e
          key: ${{ needs.check.outputs.app_key }}

      # The accessibility audit's test bundle, built and cached here on a
      # miss, so the audit job restores it instead of spending about 5
      # minutes on it every run (a push to main that builds the app fills
      # the cache PRs read).
      # Not this job's check: an audit bundle that won't build fails the
      # audit job, which builds it again.
      - name: Cache the accessibility audit's test bundle
        uses: ./.github/actions/a11y-audit-bundle
        continue-on-error: true

  # The three simulator jobs below share their setup (a booted simulator,
  # the app from the build job, Maestro) through .github/actions/simulator-app
  # and run side by side once the app exists: the suite here, the
  # accessibility audit, and the screenshots and GIFs. Each `needs:` the
  # build job, so while it builds they wait, not started. `!cancelled()`
  # because `build` is skipped on most PRs, which would otherwise skip them;
  # a failed build leaves no app to test. They skip docs- and tooling-only
  # PRs (the `code` filter in `check`; a skipped job counts as passing) and
  # pushes to main, which only build the app for the cache. Pinned to
  # macos-26 (not macos-latest) so a runner-image migration can't silently
  # change simulator/Xcode behavior; bump deliberately (Expo SDK 58 needs
  # Xcode 26.4 or later; macos-15's default Xcode 16.4 cannot compile
  # expo-modules-core).
  e2e:
    name: E2E Tests (Maestro)
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.build.result != 'failure' && github.event_name != 'push' && inputs.gifs_only != true && (needs.check.outputs.code == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    # About 5 min of setup + the Maestro step's 40-min cap + the trace and
    # diagnostics. The step caps must expire before this one: a JOB timeout
    # counts as cancellation, which skips the failure()/!cancelled()
    # diagnostics and upload steps and loses all evidence (and fails the
    # check).
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/simulator-app
        with:
          app-key: ${{ needs.check.outputs.app_key }}

      # The E2E trace (src/services/trace.ts), recorded for the whole suite:
      # every touch, screen, app action, decision-guard check and JavaScript
      # stall, so a tap that did nothing says where it went
      # (scripts/app-trace.sh).
      - name: Start recording the app's trace
        run: scripts/app-trace.sh start maestro-results

      # Warm the app before the suite runs: a launch loads the baked JS
      # bundle and warms the dyld/simulator caches, cutting the cold-start
      # latency the first flow would otherwise pay. It waits for the app to
      # say Setup is up (its trace line, persisted by the step above) instead
      # of a fixed 25 s sleep, up to a minute, then lets it settle 3 s more.
      # This launch's lines lead trace.txt (their #1, #2... restart with flow
      # 01's launch). Best effort: a warm-up hiccup must never fail the job,
      # and the first flow's SiftResetState launch wipes any residual state.
      - name: Warm up the app (prime caches before the suite)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          xcrun simctl launch booted com.jessicahirsh.sift || true
          start=$SECONDS
          ready=""
          while [ $((SECONDS - start)) -lt 60 ]; do
            # The log store, not the stream's file: the stream may write in blocks.
            if xcrun simctl spawn booted log show --info --last 2m --style compact \
              --predicate 'subsystem == "com.facebook.react.log" AND eventMessage CONTAINS "screen name=setup at=up"' 2>/dev/null \
              | grep -q 'screen name=setup at=up'; then
              ready=$((SECONDS - start))
              break
            fi
            sleep 1
          done
          if [ -n "$ready" ]; then
            echo "Setup was up within ${ready}s"
            sleep 3
          else
            echo "::warning::The warm-up launch never reported Setup (no trace line in 60 s)."
          fi
          xcrun simctl terminate booted com.jessicahirsh.sift || true

      - name: Run Maestro tests
        # A step timeout counts as a failure (not a cancellation), so the
        # diagnostics and artifact upload below still run. run-e2e.sh also
        # fails fast when the driver is down rather than timing out per flow.
        timeout-minutes: 40
        env:
          # GitHub-hosted macOS runners can be slow enough that the XCUITest
          # driver misses Maestro's default startup window (seen as
          # IOSDriverTimeoutException in run 29703273714). Give it 5 minutes.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          # No analytics network call — one less nondeterministic dependency.
          MAESTRO_CLI_NO_ANALYTICS: "1"
          E2E_OUT_DIR: maestro-results
        # The whole suite runs in one session; then only the flows that died
        # of a driver/transport error are re-run alone on a fresh driver, so
        # one driver death can't cascade into every remaining flow (main run
        # 34544916181: 1 driver crash -> 11/11 failed). App-level failures
        # (assertions, missing elements) are NEVER retried; each re-run is
        # annotated as a warning. See scripts/run-e2e.sh for the policy.
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          scripts/run-e2e.sh .maestro

      # Passing runs keep their trace too: it's the baseline a failure's is
      # read against.
      - name: Stop recording the trace
        if: ${{ !cancelled() }}
        run: scripts/app-trace.sh stop maestro-results

      # Failure-only extras on top of run-e2e.sh's per-flow logs: where
      # Maestro wrote its own output, a simulator log tail, and a screenshot
      # of whatever screen was up. Diagnostics must never themselves fail —
      # every command here is guarded.
      - name: Locate Maestro output (diagnostics)
        if: failure()
        run: |
          mkdir -p maestro-results
          {
            echo "=== CWD candidates ==="
            find . -maxdepth 2 \( -name 'maestro-*' -o -name '*.png' -o -name 'debug*' \) -not -path './node_modules/*' 2>/dev/null | head -20 || true
            echo "=== HOME/.maestro ==="
            find "$HOME/.maestro" -maxdepth 3 2>/dev/null | head -30 || true
            echo "=== per-flow results ==="
            ls -la maestro-results 2>/dev/null || true
          } 2>&1 | tee maestro-results/diagnostics.txt || true
          xcrun simctl spawn booted log show --style compact --last 10m 2>/dev/null | tail -300 > maestro-results/simulator-log-tail.txt || true
          # The app's own lines across the suite: the tail above is mostly
          # other processes by the time this step runs.
          xcrun simctl spawn booted log show --style compact --last 45m --predicate 'process == "Sift"' 2>/dev/null | tail -3000 > maestro-results/app-log.txt || true
          # Which SCREEN was up when the wait timed out? Everything above proves
          # the app is alive but not WHERE it was — a 30s card-wait timeout
          # looks identical whether we stalled on Loading (a real stall) or were
          # already on Sifting with the element merely unseen (transition flake).
          # A screenshot disambiguates the two and is captured straight off the
          # simulator, so it works regardless of Maestro's debug-output quirks
          # and guarantees the artifact is non-empty on any in-flow failure.
          xcrun simctl io booted screenshot maestro-results/failure-screenshot.png || true
          # Maestro writes per-flow screenshots + view hierarchies (its XCUITest
          # accessibility snapshot) on failure, but the directory varies by
          # version; copy whatever landed under ~/.maestro/tests into the folder
          # so the UI hierarchy at the point of failure travels with the shot.
          cp -R "$HOME/.maestro/tests" maestro-results/maestro-tests 2>/dev/null || true

      # Uploaded on success too: a run that passed only after a driver retry
      # still carries the failed attempt's log, which is the evidence needed
      # to chase the infra flake down instead of shrugging it off.
      - name: Upload Maestro results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          # Per-flow logs + JUnit + debug output from scripts/run-e2e.sh, plus
          # ~/.maestro/tests (where some Maestro versions write screenshots and
          # view hierarchies regardless of --debug-output). run-e2e.sh always
          # writes a log per flow, so an empty artifact means the job broke
          # before the suite ran — fail loudly rather than upload nothing.
          path: |
            maestro-results
            ~/.maestro/tests
            ~/.maestro/**/*.png
          if-no-files-found: error
          retention-days: 7

  # Xcode's accessibility audit, its own check: it fails the PR on an issue
  # it finds, where the screenshots and GIFs only make pictures.
  a11y:
    name: Accessibility audit
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.build.result != 'failure' && github.event_name != 'push' && inputs.gifs_only != true && (needs.check.outputs.code == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    # About 5 min of setup, the audit bundle (restored, or about 5 min to
    # build on a miss) and the audit's 15-min cap.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/simulator-app
        with:
          app-key: ${{ needs.check.outputs.app_key }}
          maestro: 'false'

      - id: audit-bundle
        uses: ./.github/actions/a11y-audit-bundle

      # Xcode's accessibility audit (#146) on Setup, Sift, Settings and Done,
      # light and dark: contrast, hit targets, clipped text, Dynamic Type,
      # descriptions and traits, as iOS renders them (the Jest scan only sees
      # props). Any issue, or a screen the pass never reached, fails the
      # job: each is an error annotation and a row in the step summary. A
      # pass took about 40 s when this ran after the E2E suite; on a fresh
      # runner, minutes after it booted, it takes 1 to 2 min (the whole
      # machine is slower then), so the cap leaves room.
      - name: Accessibility audit
        timeout-minutes: 15
        run: scripts/run-a11y-audit.sh "$(ls -d build/e2e/*.app | head -1)" "${{ steps.audit-bundle.outputs.dir }}"

      - name: Upload accessibility audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: a11y-audit
          path: a11y-audit
          if-no-files-found: ignore
          retention-days: 7

  # Pictures, not a gate itself: the screenshots for PR descriptions, the
  # README (readme-screenshots.yml takes this run's ios-screenshots artifact)
  # and the Visual regression job below, which compares them, and
  # the GIF scenarios' videos (scripts/pr-gifs.mjs takes ios-gif-videos;
  # a gifs-only run by hand records only these).
  pictures:
    name: Screenshots and GIFs
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.build.result != 'failure' && github.event_name != 'push' && (needs.check.outputs.code == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    # About 5 min of setup + the screenshots' 10-min cap + the GIFs' 10.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/simulator-app
        with:
          app-key: ${{ needs.check.outputs.app_key }}

      # The main screens on the Simulator, light and dark, for PR
      # descriptions (CLAUDE.md, "Show UI changes in the PR") and Visual
      # regression: real SF Symbols and materials, which a web export can't
      # draw. It never fails the job; a screen it missed fails Visual
      # regression, and the app's trace, recorded around it as in the E2E
      # job (scripts/app-trace.sh) and uploaded with the shots, says where
      # its taps went.
      - name: Start recording the app's trace
        if: inputs.gifs_only != true
        run: scripts/app-trace.sh start screenshots

      - name: Take screenshots
        if: inputs.gifs_only != true
        timeout-minutes: 10
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          scripts/take-screenshots.sh screenshots

      - name: Stop recording the trace
        if: ${{ !cancelled() && inputs.gifs_only != true }}
        run: scripts/app-trace.sh stop screenshots

      - name: Upload screenshots
        if: ${{ !cancelled() && inputs.gifs_only != true }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14

      # The GIF scenarios in e2e/gifs, recorded on the Simulator with the
      # touches drawn (components/TouchOverlay), as videos that
      # scripts/pr-gifs.mjs turns into a PR's before/after GIFs. A run by
      # hand on main can record another commit's scenarios (the PR's), for
      # its "before". It never fails the job.
      - name: Fetch the GIF scenarios to record
        id: gif-scenarios
        if: inputs.gif_scenarios_from != '' && inputs.gif_scenarios_from != null
        env:
          FROM: ${{ inputs.gif_scenarios_from }}
        run: |
          # A full commit SHA, nothing else: it goes on git's command line.
          if ! [[ "$FROM" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gif_scenarios_from must be a full commit SHA, not '$FROM'."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "$FROM"
          rm -rf e2e/gifs
          git checkout FETCH_HEAD -- e2e/gifs

      # Not when the PR's scenarios couldn't be fetched: main's own, under
      # the same names, would pass for its "before".
      - name: Record GIF videos
        if: ${{ !cancelled() && steps.gif-scenarios.outcome != 'failure' }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          xcrun simctl ui booted appearance light
          scripts/take-gifs.sh gif-videos

      - name: Upload GIF videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-gif-videos
          path: gif-videos
          if-no-files-found: warn
          retention-days: 14

  # The screenshots the pictures job took, compared with their baselines in
  # e2e/screenshots/baselines (jbhirsh/ci's visual-baselines/compare; this
  # app's settings are the `visual-baselines` key of .github/ci.json): a
  # screen that changed, appeared or wasn't taken fails it, with each shot
  # and its diff in the visual-diffs artifact. On Linux, as the comparing
  # needs no Simulator. A change that's meant is written into the baselines
  # by visual-baselines.yml, run by hand on the PR's branch. It runs whenever
  # the pictures job ran, failed or not: a failed screenshot run fails it
  # (screens missing, or no artifact), rather than skip it as a pass.
  visual:
    name: Visual regression
    needs: [pictures]
    if: ${{ !cancelled() && needs.pictures.result != 'skipped' && inputs.gifs_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # pixelmatch and pngjs, which the comparison loads from the app.
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: ios-screenshots
          path: screenshots

      - uses: jbhirsh/ci/visual-baselines/compare@main
        with:
          fresh: screenshots
