name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # For a PR's "before" GIFs (scripts/pr-gifs.mjs): run on main with
      # the PR's scenarios, recording only.
      gifs_only:
        description: Only record the GIF scenarios (no suite, audit or screenshots)
        type: boolean
        default: false
      gif_scenarios_from:
        description: Commit whose e2e/gifs to record (empty for this run's own)
        type: string
        default: ''
      without_expo_login:
        description: Build the simulator app as a Dependabot PR does, with no Expo login (prebuild + xcodebuild)
        type: boolean
        default: false

# A gifs-only run by hand (a PR's "before" GIFs, scripts/pr-gifs.mjs) gets
# a group of its own: sharing main's, it would cancel main's push run (which
# saves the app cache PRs reuse), be cancelled by the next merge, and cancel
# another PR's GIF run.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.gifs_only == true && format('gifs-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Lint, Typecheck & Unit Test
    runs-on: ubuntu-latest
    # A hung step fails in minutes, not after GitHub's six-hour default.
    timeout-minutes: 20
    # pull-requests: read for paths-filter and the commit-message check.
    permissions:
      contents: read
      pull-requests: read
    # Expose whether anything that can affect the app or the E2E job changed,
    # so the expensive macOS `e2e` job below can skip PRs that only touch
    # docs or repo tooling. Kept as a step in this existing job
    # (not a separate job) so it adds no extra status check — and because
    # `check` itself always runs, the required check is never left pending on a
    # skipped PR the way a workflow-level `paths-ignore` did.
    outputs:
      code: ${{ steps.filter.outputs.code }}
      app_key: ${{ steps.app-key.outputs.key }}

    steps:
      - uses: actions/checkout@v7

      # Subject length, body, fixup and merge-commit rules (jbhirsh/ci).
      - name: Commit messages
        if: github.event_name == 'pull_request'
        uses: jbhirsh/ci/commits@main

      # `every`: a file counts as code only if it matches every pattern, so
      # each `!` pattern excludes. (The default, `some`, lets '**' match
      # everything, which made the exclusions dead.) Excluded: docs, repo
      # config (the formatter's, the audits' and type coverage's included),
      # and tooling that can't change the app or this job: other
      # workflows (ci.yml is this job), CI
      # helpers, and scripts/ apart from the E2E job's runners (suite,
      # audit, screenshots, GIFs).
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/*'
              - '!.github/workflows/!(ci).yml'
              - '!scripts/!(run-e2e.sh|run-a11y-audit.sh|take-screenshots.sh|take-gifs.sh|build-simulator-app.sh)'
              - '!stryker.config.json'
              - '!.prettierrc.json'
              - '!.prettierignore'
              - '!.git-blame-ignore-revs'
              - '!knip.jsonc'
              - '!.jscpd.json'
              - '!.lycheeignore'
              - '!tsconfig.typecov.json'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The E2E job's app cache key, worked out here where node_modules
      # already is, so the E2E job installs nothing to look its app up. The
      # native fingerprint, plus the bundle's inputs: src/, the entry point,
      # the Metro config, the lockfile (a JavaScript-only package isn't in
      # the native fingerprint, and a bump of one must rebuild, not test
      # main's old bundle), .env (its EXPO_UNSTABLE_* flags change the
      # bundle) and the bundled assets. Tests and Maestro flows aren't in the
      # app, so a test-only change mustn't force a rebuild. Ubuntu's hash
      # needn't match a Mac's: this job makes the key both where the app is
      # saved and where it's looked up.
      - name: App cache key
        id: app-key
        run: |
          NATIVE=$(npx expo-updates fingerprint:generate --platform ios 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['hash'])")
          SOURCE=$( (find src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print0; find assets -type f -print0; printf '%s\0' index.ts metro.config.js package-lock.json .env) | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "key=sift-e2e-${NATIVE}-${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "App cache key: sift-e2e-${NATIVE}-${SOURCE}"

      - name: Autofix triggers
        # Every pull-request workflow must wake Claude autofix or be exempt
        # in .github/ci.json (jbhirsh/ci's autofix/check-triggers.mjs says
        # why), so a new one can't be left out of claude-autofix.yml.
        if: github.event_name == 'pull_request'
        uses: jbhirsh/ci/autofix/check-triggers@main

      # The package scripts, so a clean pre-commit hook means a clean CI.
      - name: Lint
        run: npm run lint

      # Prettier over the whole tree (.prettierrc.json, .prettierignore).
      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # No `any` anywhere in the app code (src, the native module's
      # TypeScript, scripts/*.ts: tsconfig.typecov.json): type-coverage must
      # find every expression typed (package.json "typeCoverage"). Its strict
      # figure, which also counts `as` casts, non-null assertions and `any`
      # inside generics, goes in the summary for information only.
      - name: Type coverage
        run: |
          npm run -s typecov
          strict=$(npm run -s typecov:strict | grep -o '[0-9.]*%' | tail -1)
          echo "Strict type coverage (information only): $strict" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dependency graph
        run: npm run depcruise

      - name: Native bridge
        # Keeps modules/expo-musickit thin: every native function is listed
        # in native-api.json, Swift and TypeScript surfaces match, and size
        # budgets hold (scripts/nativeBridge.ts).
        run: npm run bridge

      - name: Test with coverage
        run: npx jest --coverage

      - name: Expo Doctor
        run: npx expo-doctor@latest
        continue-on-error: true

      # Fail the PR on known critical vulnerabilities in production deps.
      # Critical, not high like the web repos: Expo's own build tooling
      # (@expo/cli, node-forge, image-size) carries high advisories whose
      # only npm "fix" is a downgrade to an ancient Expo, so a high gate
      # would be permanently red over code that doesn't ship in the app.
      # Dependabot picks up Expo's fixes on its weekly run.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # Which native-affecting files a PR changed: the build job below runs only
  # for those. A step of its own job, not a trigger-level paths filter: a
  # filtered-out workflow never reports, which would leave the required
  # build check hanging at "Expected"; a job skipped by its `if:` passes it.
  changes:
    name: Detect native changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - 'modules/**'
              - 'app.json'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'scripts/build-simulator-app.sh'

  # The compile gate for the native code: lint, typecheck and Jest never
  # touch the Swift in modules/expo-musickit, so this is the only check that
  # proves it still compiles (free on a public repo's macOS runners). It
  # builds the same e2e-simulator app the E2E job installs, and hands it over
  # as an artifact: the E2E job `needs:` this one, so on a native PR it waits,
  # not started, while the app builds, rather than running a step that polls
  # for it. On other PRs this is skipped and E2E restores its cached app.
  build:
    name: Build iOS simulator app
    needs: changes
    # A run by hand skips `changes` (no PR to diff), so `!cancelled()` keeps
    # a skipped dependency from skipping this job; it builds then only when
    # asked to try the no-login path. Fail-safe: if change detection itself
    # errored, build anyway, as a skipped job reads as a passing check.
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.native == 'true' || inputs.without_expo_login == true) }}
    # The same image as the e2e job, which installs this build.
    runs-on: macos-26
    # A cold build takes about 30 minutes; without a limit a stuck one would
    # hold a macOS runner for GitHub's 6-hour default.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Only the eas path needs the EAS CLI.
      - name: Setup EAS CLI
        if: env.HAS_EXPO_TOKEN == 'true' && inputs.without_expo_login != true
        run: npm install -g eas-cli

      # Every PR really builds, Dependabot's included (#178): its runs get no
      # Actions secrets, so without EXPO_TOKEN the script builds the same
      # e2e-simulator app with no Expo or Apple login (expo prebuild +
      # xcodebuild). A run by hand with without_expo_login takes that path
      # on purpose, to check it. Without SENTRY_AUTH_TOKEN the source-map
      # upload is turned off rather than the build skipped.
      - name: Build simulator app (compiles expo-musickit Swift)
        run: scripts/build-simulator-app.sh build/Sift-e2e.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SIFT_BUILD_WITHOUT_EXPO: ${{ inputs.without_expo_login == true && '1' || '' }}
          USE_CCACHE: '1'

      - uses: actions/upload-artifact@v7
        with:
          name: sift-simulator-app
          path: build/Sift-e2e.tar.gz
          retention-days: 7

  e2e:
    name: E2E Tests (Maestro)
    needs: [check, build]
    # Skip the macOS job when only docs or repo tooling changed (see the
    # `code` filter in `check`; the required `check` still runs and gates the
    # merge, and a skipped job counts as passing). Always runs on manual
    # dispatch. `!cancelled()` because `build` is skipped on most PRs, which
    # would otherwise skip this too; a failed build leaves no app to test.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.build.result != 'failure' && (needs.check.outputs.code == 'true' || github.event_name == 'workflow_dispatch') }}
    # Runs on GitHub-hosted macOS (free on public repos) on every PR. On push
    # to main it only builds and caches the app (see RUN_SUITE below). It
    # takes the app from actions/cache (the key `check` works out), or from
    # the build job's artifact on a native PR, and builds it itself (~20-30
    # min) only when neither has it: a JavaScript change on a PR that leaves
    # the native layer alone.
    # Dependabot's runs get no Actions secrets, so no EXPO_TOKEN: on a cache
    # miss they take the build job's artifact (every npm bump changes
    # package-lock.json, so it builds), and failing that,
    # scripts/build-simulator-app.sh builds the same app with no Expo login
    # (#178).
    # Pinned (not macos-latest) so a runner-image migration can't silently
    # change simulator/Xcode behavior; bump deliberately. macos-26 is the
    # image the working builds resolve to (Xcode 26; Expo SDK 57 requires
    # >=26 — macos-15's default Xcode 16.4 cannot compile expo-modules-core).
    runs-on: macos-26
    # Worst case: ~10 min setup + the build's 60-min cap + ~3 min simulator
    # prep + the Maestro step's 40-min cap + the accessibility audit's
    # 10-min cap + the screenshots' 10 + the GIFs' 10. The step caps must
    # expire before this one: a JOB timeout counts as cancellation, which
    # skips the failure()/!cancelled() diagnostics and upload steps and
    # loses all evidence (and fails the check).
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # Main re-ran the suite on code that had just passed as a PR. It still
      # builds there, because only caches saved on main can be restored by
      # PRs (a PR's cache is visible to that PR alone): a PR that leaves src/
      # and the native layer alone then reuses main's app instead of a cold
      # ~17-min build.
      RUN_SUITE: ${{ github.event_name != 'push' && inputs.gifs_only != true }}
      # The simulator is up for the suite, and for a GIFs-only run too.
      ON_SIMULATOR: ${{ github.event_name != 'push' }}
      # Without it (Dependabot's runs) the build needs no EAS CLI (#178).
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v7

      # Booting takes 1.5-3 min, so it starts here and runs while Maestro
      # and the app are fetched (or the app built); the job waits for it
      # just before installing the app.
      - name: Start booting the iOS Simulator
        if: env.ON_SIMULATOR == 'true'
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
              if 'iOS' in runtime:
                  for d in devs:
                      if 'iPhone' in d['name']:
                          print(d['udid'])
                          sys.exit(0)
          ")
          echo "SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

      # Maestro's latest release, cached under its version: every run tests
      # with the newest Maestro without downloading it each time (the
      # install took about 4.5 minutes). Unknown (the API failed), it
      # installs the latest uncached rather than file it under no version.
      - name: Find Maestro's latest release
        id: maestro
        if: env.ON_SIMULATOR == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/mobile-dev-inc/maestro/releases/latest --jq .tag_name)
          echo "version=${tag#cli-}" >> "$GITHUB_OUTPUT"

      - name: Restore Maestro
        id: maestro-cache
        if: env.ON_SIMULATOR == 'true' && steps.maestro.outputs.version != ''
        uses: actions/cache@v6
        with:
          path: |
            ~/.maestro/bin
            ~/.maestro/lib
          key: maestro-${{ runner.os }}-${{ runner.arch }}-${{ steps.maestro.outputs.version }}

      # Prints the version so every run records which Maestro it tested with.
      - name: Install Maestro
        if: env.ON_SIMULATOR == 'true'
        env:
          MAESTRO_VERSION: ${{ steps.maestro.outputs.version }}
        run: |
          if [ "${{ steps.maestro-cache.outputs.cache-hit }}" != true ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Restore build cache
        id: build-cache
        uses: actions/cache@v6
        with:
          path: build/e2e
          key: ${{ needs.check.outputs.app_key }}

      # On a native PR the build job has just built this app (the job waited
      # for it, not started): take its artifact rather than build it again.
      - name: Take the build job's app
        id: reuse
        if: steps.build-cache.outputs.cache-hit != 'true' && needs.build.result == 'success'
        # A failed download builds here instead, rather than failing the job.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: sift-simulator-app
          path: build

      # Neither cached nor built by the build job (a JavaScript change, or a
      # push to main): build it here. Only this needs Node and the packages.
      - uses: actions/setup-node@v7
        if: steps.build-cache.outputs.cache-hit != 'true' && steps.reuse.outcome != 'success'
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        if: steps.build-cache.outputs.cache-hit != 'true' && steps.reuse.outcome != 'success'
        run: npm ci

      # Only a build needs the EAS CLI (about 30 s to install).
      - name: Setup EAS CLI
        if: steps.build-cache.outputs.cache-hit != 'true' && steps.reuse.outcome != 'success' && env.HAS_EXPO_TOKEN == 'true'
        run: npm install -g eas-cli

      - name: Build simulator app
        if: steps.build-cache.outputs.cache-hit != 'true' && steps.reuse.outcome != 'success'
        # A cold build takes about 30 minutes and ran past 40 on a slow runner
        # (#168): the same cap as the build job's.
        timeout-minutes: 60
        # eas with EXPO_TOKEN, otherwise prebuild + xcodebuild with no login.
        run: scripts/build-simulator-app.sh build/Sift-e2e.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          USE_CCACHE: '1'

      # The cache step saves build/e2e at the end of the job, for later runs.
      - name: Extract build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/e2e
          tar -xzf build/Sift-e2e.tar.gz -C build/e2e

      # Block until SpringBoard is actually up (the boot started near the
      # top of the job): attaching the XCUITest driver to a half-booted
      # simulator is the main startup-flake source.
      - name: Wait for the iOS Simulator to finish booting
        if: env.ON_SIMULATOR == 'true'
        run: xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Install app on simulator
        if: env.ON_SIMULATOR == 'true'
        run: xcrun simctl install booted build/e2e/*.app

      # The E2E trace (src/services/trace.ts): the test build writes a line
      # to the system log for every touch, screen, app action and decision-
      # guard check, and for any stall of the JavaScript thread, so a tap
      # that did nothing says where it went. The lines are info level, which
      # iOS keeps only in memory by default: persist them for React Native's
      # subsystem, and stream them live for the whole suite as well.
      - name: Start recording the app's trace
        if: env.RUN_SUITE == 'true'
        run: |
          mkdir -p maestro-results
          xcrun simctl spawn booted log config --subsystem com.facebook.react.log --mode "level:info,persist:info" || true
          nohup xcrun simctl spawn booted log stream --level info --style compact \
            --predicate 'subsystem == "com.facebook.react.log" AND eventMessage CONTAINS "[sift-trace]"' \
            > maestro-results/trace.txt 2> maestro-results/trace-stream.err &
          echo $! > "$RUNNER_TEMP/trace-stream.pid"

      # Warm the app before the suite runs: a launch loads the baked JS
      # bundle and warms the dyld/simulator caches, cutting the cold-start
      # latency the first flow would otherwise pay. It waits for the app to
      # say Setup is up (its trace line, persisted by the step above) instead
      # of a fixed 25 s sleep, up to a minute, then lets it settle 3 s more.
      # This launch's lines lead trace.txt (their #1, #2... restart with flow
      # 01's launch). Best effort: a warm-up hiccup must never fail the job,
      # and the first flow's SiftResetState launch wipes any residual state.
      - name: Warm up the app (prime caches before the suite)
        if: env.RUN_SUITE == 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          xcrun simctl launch booted com.jessicahirsh.sift || true
          start=$SECONDS
          ready=""
          while [ $((SECONDS - start)) -lt 60 ]; do
            # The log store, not the stream's file: the stream may write in blocks.
            if xcrun simctl spawn booted log show --info --last 2m --style compact \
              --predicate 'subsystem == "com.facebook.react.log" AND eventMessage CONTAINS "screen name=setup at=up"' 2>/dev/null \
              | grep -q 'screen name=setup at=up'; then
              ready=$((SECONDS - start))
              break
            fi
            sleep 1
          done
          if [ -n "$ready" ]; then
            echo "Setup was up within ${ready}s"
            sleep 3
          else
            echo "::warning::The warm-up launch never reported Setup (no trace line in 60 s)."
          fi
          xcrun simctl terminate booted com.jessicahirsh.sift || true

      - name: Run Maestro tests
        id: suite
        if: env.RUN_SUITE == 'true'
        # A step timeout counts as a failure (not a cancellation), so the
        # diagnostics and artifact upload below still run. run-e2e.sh also
        # fails fast when the driver is down rather than timing out per flow.
        timeout-minutes: 40
        env:
          # GitHub-hosted macOS runners can be slow enough that the XCUITest
          # driver misses Maestro's default startup window (seen as
          # IOSDriverTimeoutException in run 29703273714). Give it 5 minutes.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          # No analytics network call — one less nondeterministic dependency.
          MAESTRO_CLI_NO_ANALYTICS: "1"
          E2E_OUT_DIR: maestro-results
        # The whole suite runs in one session; then only the flows that died
        # of a driver/transport error are re-run alone on a fresh driver, so
        # one driver death can't cascade into every remaining flow (main run
        # 34544916181: 1 driver crash -> 11/11 failed). App-level failures
        # (assertions, missing elements) are NEVER retried; each re-run is
        # annotated as a warning. See scripts/run-e2e.sh for the policy.
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          scripts/run-e2e.sh .maestro

      # Passing runs keep their trace too: it's the baseline a failure's is
      # read against. If the live stream lost its tail, the persisted log
      # fills it in. An empty trace is a warning (the trace itself broke),
      # never a failure.
      - name: Stop recording the trace
        if: ${{ !cancelled() && env.RUN_SUITE == 'true' }}
        run: |
          pid=$(cat "$RUNNER_TEMP/trace-stream.pid" 2>/dev/null || true)
          if [ -n "$pid" ]; then kill -INT "$pid" 2>/dev/null || true; sleep 2; kill "$pid" 2>/dev/null || true; fi
          xcrun simctl spawn booted log show --info --style compact --last 60m \
            --predicate 'subsystem == "com.facebook.react.log" AND eventMessage CONTAINS "[sift-trace]"' \
            > maestro-results/trace-persisted.txt 2>/dev/null || true
          # Trace lines only: log's own header quotes the predicate.
          streamed=$(grep -c '\[sift-trace\] #' maestro-results/trace.txt 2>/dev/null || true)
          persisted=$(grep -c '\[sift-trace\] #' maestro-results/trace-persisted.txt 2>/dev/null || true)
          echo "Trace lines: ${streamed:-0} streamed, ${persisted:-0} persisted"
          if [ "${persisted:-0}" -gt "${streamed:-0}" ]; then
            cp maestro-results/trace-persisted.txt maestro-results/trace.txt
          fi
          if [ "${streamed:-0}" -eq 0 ] && [ "${persisted:-0}" -eq 0 ]; then
            echo "::warning::The app's E2E trace came out empty. See maestro-results/trace-stream.err."
          fi

      # Failure-only extras on top of run-e2e.sh's per-flow logs: where
      # Maestro wrote its own output, a simulator log tail, and a screenshot
      # of whatever screen was up. Diagnostics must never themselves fail —
      # every command here is guarded.
      - name: Locate Maestro output (diagnostics)
        if: failure() && env.RUN_SUITE == 'true'
        run: |
          mkdir -p maestro-results
          {
            echo "=== CWD candidates ==="
            find . -maxdepth 2 \( -name 'maestro-*' -o -name '*.png' -o -name 'debug*' \) -not -path './node_modules/*' 2>/dev/null | head -20 || true
            echo "=== HOME/.maestro ==="
            find "$HOME/.maestro" -maxdepth 3 2>/dev/null | head -30 || true
            echo "=== per-flow results ==="
            ls -la maestro-results 2>/dev/null || true
          } 2>&1 | tee maestro-results/diagnostics.txt || true
          xcrun simctl spawn booted log show --style compact --last 10m 2>/dev/null | tail -300 > maestro-results/simulator-log-tail.txt || true
          # The app's own lines across the suite: the tail above is mostly
          # other processes by the time this step runs.
          xcrun simctl spawn booted log show --style compact --last 45m --predicate 'process == "Sift"' 2>/dev/null | tail -3000 > maestro-results/app-log.txt || true
          # Which SCREEN was up when the wait timed out? Everything above proves
          # the app is alive but not WHERE it was — a 30s card-wait timeout
          # looks identical whether we stalled on Loading (a real stall) or were
          # already on Sifting with the element merely unseen (transition flake).
          # A screenshot disambiguates the two and is captured straight off the
          # simulator, so it works regardless of Maestro's debug-output quirks
          # and guarantees the artifact is non-empty on any in-flow failure.
          xcrun simctl io booted screenshot maestro-results/failure-screenshot.png || true
          # Maestro writes per-flow screenshots + view hierarchies (its XCUITest
          # accessibility snapshot) on failure, but the directory varies by
          # version; copy whatever landed under ~/.maestro/tests into the folder
          # so the UI hierarchy at the point of failure travels with the shot.
          cp -R "$HOME/.maestro/tests" maestro-results/maestro-tests 2>/dev/null || true

      # Uploaded on success too: a run that passed only after a driver retry
      # still carries the failed attempt's log, which is the evidence needed
      # to chase the infra flake down instead of shrugging it off.
      - name: Upload Maestro results
        if: ${{ !cancelled() && env.RUN_SUITE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          # Per-flow logs + JUnit + debug output from scripts/run-e2e.sh, plus
          # ~/.maestro/tests (where some Maestro versions write screenshots and
          # view hierarchies regardless of --debug-output). run-e2e.sh always
          # writes a log per flow, so an empty artifact means the job broke
          # before the suite ran — fail loudly rather than upload nothing.
          path: |
            maestro-results
            ~/.maestro/tests
            ~/.maestro/**/*.png
          if-no-files-found: error
          retention-days: 7

      # Xcode's accessibility audit (#146) on Setup, Sift, Settings and Done,
      # light and dark: contrast, hit targets, clipped text, Dynamic Type,
      # descriptions and traits, as iOS renders them (the Jest scan only sees
      # props). Runs after the suite so it can't disturb it. Any issue, or a
      # screen the pass never reached, fails the job: each is an error
      # annotation and a row in the step summary. A pass takes about 30 s.
      # This and the screenshots and GIFs below run only after a suite that
      # passed: a red suite already fails the job, so they'd only keep it
      # going another ten minutes or so.
      - name: Accessibility audit
        if: ${{ !cancelled() && env.RUN_SUITE == 'true' && steps.suite.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-a11y-audit.sh "$(ls -d build/e2e/*.app | head -1)"

      - name: Upload accessibility audit
        if: ${{ !cancelled() && env.RUN_SUITE == 'true' && steps.suite.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: a11y-audit
          path: a11y-audit
          if-no-files-found: ignore
          retention-days: 7

      # The main screens on the Simulator, light and dark, for PR
      # descriptions (CLAUDE.md, "Show UI changes in the PR"): real SF
      # Symbols and materials, which a web export can't draw. Last, so it
      # can't disturb the suite or the audit, and it never fails the job.
      - name: Take screenshots
        if: ${{ !cancelled() && env.RUN_SUITE == 'true' && steps.suite.outcome == 'success' }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          scripts/take-screenshots.sh screenshots

      - name: Upload screenshots
        if: ${{ !cancelled() && env.RUN_SUITE == 'true' && steps.suite.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14

      # The GIF scenarios in e2e/gifs, recorded on the Simulator with the
      # touches drawn (components/TouchOverlay), as videos that
      # scripts/pr-gifs.mjs turns into a PR's before/after GIFs. A run by
      # hand on main can record another commit's scenarios (the PR's), for
      # its "before". Last, so it can't disturb the rest; never fails the job.
      - name: Fetch the GIF scenarios to record
        id: gif-scenarios
        if: ${{ !cancelled() && env.ON_SIMULATOR == 'true' && steps.suite.outcome != 'failure' && inputs.gif_scenarios_from != '' && inputs.gif_scenarios_from != null }}
        env:
          FROM: ${{ inputs.gif_scenarios_from }}
        run: |
          # A full commit SHA, nothing else: it goes on git's command line.
          if ! [[ "$FROM" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gif_scenarios_from must be a full commit SHA, not '$FROM'."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin -- "$FROM"
          rm -rf e2e/gifs
          git checkout FETCH_HEAD -- e2e/gifs

      # Not when the PR's scenarios couldn't be fetched: main's own, under
      # the same names, would pass for its "before".
      - name: Record GIF videos
        if: ${{ !cancelled() && env.ON_SIMULATOR == 'true' && steps.suite.outcome != 'failure' && steps.gif-scenarios.outcome != 'failure' }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          xcrun simctl ui booted appearance light
          scripts/take-gifs.sh gif-videos

      - name: Upload GIF videos
        if: ${{ !cancelled() && env.ON_SIMULATOR == 'true' && steps.suite.outcome != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-gif-videos
          path: gif-videos
          if-no-files-found: warn
          retention-days: 14
