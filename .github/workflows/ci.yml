name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Lint, Typecheck & Unit Test
    runs-on: ubuntu-latest
    # Expose whether any non-docs file changed so the expensive macOS `e2e`
    # job below can skip docs-only PRs. Kept as a step in this existing job
    # (not a separate job) so it adds no extra status check — and because
    # `check` itself always runs, the required check is never left pending on a
    # docs-only PR the way a workflow-level `paths-ignore` did.
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!.github/**/*.md'
              - '!LICENSE'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Dependency graph
        run: npx depcruise src

      - name: Test with coverage
        run: npx jest --coverage

      - name: Expo Doctor
        run: npx expo-doctor@latest
        continue-on-error: true

  e2e:
    name: E2E Tests (Maestro)
    needs: check
    # Skip the ~30-min macOS build on docs-only changes (the required `check`
    # still runs and gates the merge). Always runs on manual dispatch.
    if: needs.check.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    # Runs on GitHub-hosted macOS (free on public repos) on every PR and push
    # to main. A cold run rebuilds the simulator app (~20-30 min); warm runs
    # restore it from actions/cache keyed on the project fingerprint, or reuse
    # the ios-build artifact for the same head SHA (~1 min).
    # Caveat: the build step needs EXPO_TOKEN, which dependabot-triggered PRs
    # don't receive (they read Dependabot secrets, not Actions secrets) — on a
    # cache miss those PRs fail here until the token is mirrored into
    # Dependabot secrets.
    # Pinned (not macos-latest) so a runner-image migration can't silently
    # change simulator/Xcode behavior; bump deliberately. macos-26 is the
    # image the working builds resolve to (Xcode 26; Expo SDK 55 requires
    # >=26 — macos-15's default Xcode 16.4 cannot compile expo-modules-core).
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Compute project fingerprint
        id: fingerprint
        run: |
          NATIVE=$(npx expo-updates fingerprint:generate --platform ios 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['hash'])")
          SOURCE=$(find src __tests__ -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          FINGERPRINT="${NATIVE}-${SOURCE}"
          echo "hash=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "Fingerprint: $FINGERPRINT"

      - name: Restore build cache
        id: build-cache
        uses: actions/cache@v6
        with:
          path: build/e2e
          key: sift-e2e-${{ steps.fingerprint.outputs.hash }}

      # The ios-build job builds the identical e2e-simulator profile on PR CI
      # and uploads it; reusing that artifact turns a ~30-minute cold rebuild
      # into a ~1-minute download whenever this head already built there.
      - name: Reuse ios-build artifact if available
        id: reuse
        if: steps.build-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/ios-build.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "${{ github.repository }}" --name sift-simulator-app --dir build/; then
            mkdir -p build/e2e
            tar -xzf build/Sift-e2e.tar.gz -C build/e2e
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Reused simulator app from ios-build run $run_id"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No reusable ios-build artifact for this sha — building."
          fi

      - name: Build simulator app
        if: steps.build-cache.outputs.cache-hit != 'true' && steps.reuse.outputs.hit != 'true'
        run: eas build --profile e2e-simulator --platform ios --local --non-interactive --output build/Sift-e2e.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          USE_CCACHE: '1'

      - name: Extract build
        if: steps.build-cache.outputs.cache-hit != 'true' && steps.reuse.outputs.hit != 'true'
        run: |
          mkdir -p build/e2e
          tar -xzf build/Sift-e2e.tar.gz -C build/e2e

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
              if 'iOS' in runtime:
                  for d in devs:
                      if 'iPhone' in d['name']:
                          print(d['udid'])
                          sys.exit(0)
          ")
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          # Block until SpringBoard is actually up — attaching the XCUITest
          # driver to a half-booted simulator is the main startup-flake source.
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Install app on simulator
        run: xcrun simctl install booted build/e2e/*.app

      # Warm the app before the suite runs. Maestro executes the suite's
      # flows in a non-deterministic order (observed: a 00_-prefixed flow ran
      # mid-suite, not first), so a warmup *flow* cannot guarantee it primes
      # ahead of the first real flow. Do it here instead: a plain
      # launch + settle + terminate loads the baked JS bundle and warms the
      # dyld/simulator caches, cutting the cold-start latency the flake
      # clusters on. Best effort — a warmup hiccup must never fail the job,
      # and the first real flow's clearState wipes any residual state.
      - name: Warm up the app (prime caches before the suite)
        run: |
          xcrun simctl launch booted com.jessicahirsh.sift || true
          sleep 25
          xcrun simctl terminate booted com.jessicahirsh.sift || true

      - name: Run Maestro tests
        env:
          # GitHub-hosted macOS runners can be slow enough that the XCUITest
          # driver misses Maestro's default startup window (seen as
          # IOSDriverTimeoutException in run 29703273714). Give it 5 minutes.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          # No analytics network call — one less nondeterministic dependency.
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p maestro-debug
          # One invocation for the whole folder. Per-flow invocation was tried
          # (run 34546956234) to get evidence captured at the failure: it works,
          # but costs 34 min against this step's 10 min, because each flow then
          # pays a fresh JVM start and driver attach (~13 min total) AND loses
          # the warm simulator, which doubles the flows themselves —
          # 01_app_launch alone went 21s -> 4m11s. With a ~20 min cold build
          # that overruns the job's 60 min cap, so the verdict is produced here,
          # fast, and evidence is gathered in the next step only on failure.
          #
          # No automatic retry: a retry would mask residual nondeterminism as
          # green runs. Every failure surfaces loudly with debug artifacts,
          # and the fix goes to the root cause, not another attempt.
          maestro test \
            --format junit --output maestro-report.xml \
            --test-output-dir maestro-debug/suite \
            .maestro/

      # Re-run each failed flow ALONE to capture the evidence the suite run
      # cannot: a single invocation only returns once all 11 flows are done, so
      # by then the failing screen is long gone. Run 34149516339 is the case in
      # point — 10_sort_picker failed at 00:03:48 and the post-suite screenshot
      # was stamped 00:18, showing an unrelated later flow mid-sift. That is
      # worse than no evidence: it looked like proof of a sort bug.
      #
      # This is NOT a retry and cannot rescue the job: the verdict was already
      # recorded by the step above, this step only runs `if: failure()`, and it
      # always exits 0 so it can never turn a red run green. A flow that passes
      # when re-run alone has told us something too — that the failure is
      # order- or timing-dependent rather than deterministic — and that is
      # written into the capture notes below.
      - name: Capture evidence for failed flows
        if: failure()
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p maestro-debug
          [ -f maestro-report.xml ] || {
            echo "No junit report — Maestro died before any flow ran; nothing to re-run."
            exit 0
          }
          # Flow files whose testcase carries a <failure>/<error>, straight from
          # the report's `file` attribute.
          failed_flows=$(python3 - <<'PY' || true
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("maestro-report.xml").getroot()
          except Exception:
              raise SystemExit
          for tc in root.iter("testcase"):
              if tc.find("failure") is not None or tc.find("error") is not None:
                  f = tc.get("file")
                  if f:
                      print(f)
          PY
          )
          [ -n "$failed_flows" ] || { echo "No failed flow recorded in the report."; exit 0; }
          for flow in $failed_flows; do
            name=$(basename "$flow" .yaml)
            echo "::group::Re-running $name to capture evidence"
            if maestro test --no-reinstall-driver \
                 --test-output-dir "maestro-debug/$name-rerun" "$flow"; then
              echo "NOTE: $name PASSED when re-run alone — the failure is not deterministic" \
                | tee "maestro-debug/$name-rerun-passed.txt"
            fi
            # Capture whatever is on screen now. After a failing re-run that is
            # the screen the flow died on; the hierarchy is the decisive part,
            # because assertVisible matches the accessibility tree, not pixels,
            # and only the tree separates "the label is absent" from "the label
            # is drawn but not yet exposed to accessibility".
            xcrun simctl io booted screenshot "maestro-debug/$name-failure.png" || true
            maestro hierarchy --no-reinstall-driver \
              > "maestro-debug/$name-hierarchy.txt" 2>&1 || true
            echo "::endgroup::"
          done
          # Never fail the job from here: the verdict is the suite step's.
          exit 0

      # Whole-job fallback, NOT the per-failure evidence — that is captured in
      # the step above, against the screen each failing flow actually died on.
      # This step runs once, after the suite, so anything it samples live from
      # the simulator reflects the END of the run. That is exactly what is
      # wanted for the case it exists to cover: when the XCUITest driver times
      # out at startup, Maestro dies before any flow runs and writes nothing —
      # no per-flow capture, no reports — and the probes below are then the only
      # evidence. They also guarantee the artifact is non-empty, which is what
      # lets the upload step keep `if-no-files-found: error` strict.
      # Diagnostics must never themselves fail — every command here is guarded.
      - name: Collect run-level diagnostics (fallback)
        if: failure()
        run: |
          mkdir -p maestro-debug
          {
            echo "=== captured debug tree ==="
            # Listed in full, not name-filtered: the previous probe matched only
            # 'maestro-*'/'*.png' at depth 2 and so reported the debug directory
            # while staying blind to everything inside it.
            find maestro-debug -type f 2>/dev/null | sort | head -60 || true
            echo "=== HOME/.maestro ==="
            find "$HOME/.maestro" -maxdepth 3 2>/dev/null | head -30 || true
            echo "=== junit report ==="
            if [ -f maestro-report.xml ]; then
              # One line per flow: which failed, and the assertion message.
              grep -E "<testcase|<failure|<error" maestro-report.xml 2>/dev/null | head -40 || true
            else
              echo "maestro-report.xml not written — Maestro died before the first flow"
            fi
          } 2>&1 | tee maestro-debug/diagnostics.txt || true
          xcrun simctl spawn booted log show --style compact --last 10m 2>/dev/null | tail -300 > maestro-debug/simulator-log-tail.txt || true
          # End-of-run screenshot. Meaningful when Maestro never started a flow
          # (nothing else captured anything); for an in-flow failure prefer
          # maestro-debug/<flow>-failure.png, which is the failing screen.
          xcrun simctl io booted screenshot maestro-debug/end-of-run-screenshot.png || true

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug
          # maestro-debug holds the per-failure capture (<flow>-failure.png,
          # <flow>-hierarchy.txt) plus whatever --test-output-dir wrote.
          # ~/.maestro/tests is Maestro's default output location, kept as a
          # fallback in case --test-output-dir does not land where its help text
          # says: two earlier attempts to capture Maestro's own debug output
          # came up empty, so do not rely on a third reading of the docs. It
          # costs nothing when absent — if-no-files-found only fires when NO
          # listed path matches. Fail loudly if none exists: an empty debug
          # artifact silently defeats the whole no-retry diagnosis doctrine.
          path: |
            maestro-debug
            maestro-report.xml
            ~/.maestro/tests
            ~/.maestro/**/*.png
          if-no-files-found: error
          retention-days: 7

  review:
    name: Claude Review
    needs: check
    # Runs as a dependent CI job on pull requests (after `check` passes) rather
    # than as a separate workflow_run workflow. On GitHub-hosted ubuntu; fork
    # PRs run without secrets, so the review only posts on same-repo PRs.
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Let the AI review run on Dependabot's dependency-bump PRs. Without
          # this, claude-code-action refuses to run for the bot actor and fails
          # with "Workflow initiated by non-human actor: dependabot (type: Bot)".
          # Allow-list only this one trusted bot rather than "*".
          allowed_bots: "dependabot[bot]"
          prompt: |
            REPO_DIR: ${{ github.workspace }}
            PR: ${{ github.event.pull_request.number }}

            Review this pull request for correctness, bugs, and adherence to
            the project conventions in CLAUDE.md (checked into the repo — read
            it). This is a React Native (Expo SDK 55, RN 0.83, TypeScript
            strict) app. Focus on:
              - Logic errors and edge cases
              - Type safety and null/undefined handling
              - React/React Native pitfalls (stale closures, effect deps,
                re-renders)
              - Violations of the project's architecture (SiftContext reducer
                pattern, phase routing, provider interface, theme tokens)
              - Missing unit tests for new reducer actions, services, or
                utilities
              - New UI experiences or user-facing flows without corresponding
                Maestro E2E coverage in .maestro/

            Do NOT flag floating GitHub Action version tags (e.g. `@v5`,
            `@v1`) as a supply-chain risk or suggest pinning to commit SHAs.
            The maintainer has accepted this trade-off.

            For every issue you find on a specific line, call the
            `mcp__github_inline_comment__create_inline_comment` tool to leave
            an inline comment anchored to that line. Do not summarize findings
            in a single top-level comment — use inline comments so each issue
            is anchored to the relevant code. Only use a top-level summary for
            overall impressions. Skip style nits already enforced by
            ESLint/Prettier. Be concise.
          classify_inline_comments: "true"
          display_report: "true"
          show_full_output: "true"
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(gh:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"
