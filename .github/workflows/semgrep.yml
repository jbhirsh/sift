# Static analysis (Semgrep SAST). Complements the other sensors — gitleaks
# catches committed secrets, mutation.yml probes assertion depth — by scanning
# source for insecure or bug-prone patterns (tainted paths, unsafe React
# Native / JS idioms, injection sinks) that lint and the Claude review don't
# systematically enforce.
#
# jbhirsh/ci's semgrep action runs the free registry scan and fails on any
# finding, over the app's own source only (`semgrep.paths` in
# .github/ci.json: src, __tests__, the custom native module and the entry
# point; not node_modules, build output or the .maestro flows). Two
# placements:
#   - Pull requests: BLOCK the merge on any finding.
#   - Weekly schedule (+ manual dispatch): a drift sensor, since the
#     registry's rules evolve. The tree was verified clean when this was
#     added.
#
# Scan-only by design: a self-contained, deterministic check is the right
# shape for a blocking PR gate, unlike BoardGames' Claude-driven autofix.
# If a real false positive ever appears, triage it precisely, never a
# blanket disable.
name: Semgrep

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: findings surface via the job log and the non-zero exit code.
permissions:
  contents: read

jobs:
  semgrep:
    name: SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: jbhirsh/ci/semgrep@main
