name: PR description

# jbhirsh/ci's description check: the PR's description is held to the shared
# shape (headings, the goal's issue, the plan table's shading, each change's
# commit, Revisions naming the head). It reads only the event's description, so it
# checks nothing out and needs no token.
#
# Triggers on every edit as well as every push: the tools that write the
# description (PR changes, PR GIFs, visual review) edit it, and the check
# must see the finished text. A newer run supersedes the older.
#
# No trigger-level `paths:` filter: like every gating workflow here it reports
# on every PR, so it can be a required check (jbhirsh/ci#112).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: jbhirsh/ci/pr-template@main
