name: Mutation Testing

# Assertion-depth sensor: Stryker mutates the reducer, services, utils and
# hooks and checks how many mutants the unit tests kill, gaps line coverage
# can't see. It runs from the shared tooling in jbhirsh/ci: what runs and
# why is in its mutation/action.yml; this app's settings are the `mutation`
# key of .github/ci.json.
#
# Pull requests only: the lines the PR changed, gated on
# stryker.config.json's `break` and on every mutated file scoring 80% on its
# changed lines (`perFileThreshold`). A PR with nothing to mutate skips
# Stryker's steps, and the job still reports (Mutation Tests (Stryker) is a
# required check: keep its name, CLAUDE.md "Required status checks"). The
# monthly full sweep, the baseline these runs start from, is
# mutation-sweep.yml.
#
# Every Stryker run uses scripts/stryker-jest-runner.mjs as Jest's runner
# (stryker.config.json): a mutant's run loads only the test files holding
# its covering tests (scripts/strykerTestFiles.ts). NODE_OPTIONS
# (`nodeOptions` in .github/ci.json) lets Stryker's runner processes load it,
# as it imports a .ts module and package.json has no "type".
on:
  # No trigger-level `paths:` filter: a filtered-out workflow never reports,
  # and the required check hangs at "Expected".
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: jbhirsh/ci/mutation@main
