# Compile gate for the iOS native code. Lint, typecheck, and Jest never touch
# the Swift in modules/expo-musickit — this job is the only PR check that
# proves it still compiles. GitHub-hosted macOS runners are free on public
# repos, so it costs nothing; it's path-filtered to native-affecting files to
# keep PR feedback fast everywhere else.
#
# The path filter lives in the `changes` job, NOT in an `on.pull_request.paths`
# trigger filter: a trigger-filtered workflow never reports at all on PRs that
# don't match, so marking its check as required in a branch rule would leave
# every other PR stuck on "Expected — Waiting for status to be reported". Here
# the workflow always runs; on non-native PRs the macOS `build` job is skipped
# by its `if:`, and a job skipped by a condition satisfies a required check.
name: iOS Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect native changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - 'modules/**'
              - 'app.json'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ios-build.yml'

  build:
    name: Build iOS simulator app
    needs: changes
    # Manual dispatch skips `changes` (no PR to diff), so `!cancelled()` keeps
    # a skipped dependency from skipping this job; on PRs it runs when a
    # native-affecting path changed. Fail-safe: if change detection itself
    # errored, build anyway — a skipped job reads as a passing required check.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result == 'failure' || needs.changes.outputs.native == 'true') }}
    # Pinned to the same image as ci.yml's e2e job, which reuses this build.
    runs-on: macos-26
    # A cold build takes about 30 minutes; without a limit a stuck one would
    # hold a macOS runner for GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      # Dependabot-triggered runs receive Dependabot secrets, not Actions
      # secrets — without EXPO_TOKEN there, eas can't authenticate, so skip
      # green with a notice rather than run a build that can only fail.
      # SENTRY_AUTH_TOKEN is only needed for the source-map upload inside the
      # build: when absent, keep the compile check and disable the upload
      # instead of skipping. Registering both as Dependabot secrets upgrades
      # bot PRs to the full check.
      - name: Check for EAS credentials
        id: creds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            if [ -n "$SENTRY_AUTH_TOKEN" ]; then
              echo "sentry_upload=false" >> "$GITHUB_OUTPUT"
            else
              echo "sentry_upload=true" >> "$GITHUB_OUTPUT"
              echo "::notice::SENTRY_AUTH_TOKEN unavailable — building with source-map upload disabled."
            fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN unavailable in this trigger context (Dependabot/fork) — skipping the iOS compile check."
          fi

      - name: Build simulator app (compiles expo-musickit Swift)
        if: steps.creds.outputs.present == 'true'
        run: eas build --profile e2e-simulator --platform ios --local --non-interactive --output build/Sift-e2e.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ steps.creds.outputs.sentry_upload }}
          USE_CCACHE: '1'

      # The E2E job (ci.yml) can reuse this instead of rebuilding: download the
      # artifact from a recent run if the fingerprint matches.
      - uses: actions/upload-artifact@v7
        if: steps.creds.outputs.present == 'true'
        with:
          name: sift-simulator-app
          path: build/Sift-e2e.tar.gz
          retention-days: 7
