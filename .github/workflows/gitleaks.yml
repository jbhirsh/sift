# Secret scanning (gitleaks). The only sensor that catches a leaked credential
# *before* it lands on main. .gitignore keeps .env.local out of the index and
# the Claude review can flag a committed secret, but both are advisory and fire
# after the secret is already in pushed branch history. This job makes it a red
# check instead — high value here because CI holds EXPO_TOKEN and
# SENTRY_AUTH_TOKEN.
#
# The scan (the PR's commits on pull requests; the full history on the weekly
# sweep, as a drift sensor) is jbhirsh/ci's gitleaks action. The full history
# was verified clean when this was added. If a false positive ever appears,
# allowlist it in a .gitleaks.toml at the repo root rather than disabling the
# job.
name: Gitleaks

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: findings are reported via the job summary and a results artifact.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: jbhirsh/ci/gitleaks@main
