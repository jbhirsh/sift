# The weekly audit: checks that need the whole repository at once, too slow
# or too noisy to gate a PR (CLAUDE.md, "CI/CD"). jbhirsh/ci's reusable
# workflow runs them, each with this repo's own config. Each category keeps
# one tracking issue, labelled weekly-audit: opened when something turns up,
# updated each week while it lasts, closed once a sweep comes back clean.
# Findings never fail the run; a tool that breaks does.
#
#   - Dead code: knip (knip.jsonc), unused files, exports and dependencies.
#   - Duplicated code: jscpd (.jscpd.json).
#   - Broken links: lychee over every markdown file, local files, images and
#     #anchors included (.lycheeignore).
#   - Architecture graph: dependency-cruiser's module graph of src/
#     (`audit.graph` in .github/ci.json), as the architecture-graph artifact
#     (its rules gate every PR in ci.yml; this is the picture).
#
# Monday 06:00 UTC, the shared sweep slot (gitleaks, semgrep; mutation.yml
# sweeps monthly, at 06:00 on the 1st), plus manual dispatch. Not a PR
# gate, so it is free to filter or skip.
name: Weekly audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    uses: jbhirsh/ci/.github/workflows/audit.yml@main
    permissions:
      contents: read
      issues: write
