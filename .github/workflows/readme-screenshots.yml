# Keeps the README's screenshots (docs/screenshots/setup, sift, done) up to
# date. When a PR merges, its CI run's screenshots job has already photographed the
# app on the iOS Simulator with the mock library (scripts/take-screenshots.sh,
# the ios-screenshots artifact), so this takes the three the README shows from
# there: no macOS minutes of its own. Each is shrunk to the README's 780 px
# (390 points at 2x) under the README's name; jbhirsh/ci's readme-screenshots
# actions replace each that looks different enough (over 0.5% of pixels) in
# one bot PR from bot/readme-screenshots, opened or updated, with auto-merge
# on, close an open one whose pictures are stale, or, when the merge brought
# no shots (its screenshots job didn't run), bring an open one up to date with main.
# Settings isn't refreshed: the README shows a crop of it, chosen by hand.
#
# Two jobs, so the token that can push never meets npm: `capture` downloads,
# shrinks and compares with a read-only token; `publish` runs only git and gh,
# with BOT_PR_TOKEN (the publish action's `token` input says why it's needed).
#
# Not a gate (no PR runs it), so the merged-only filter lives in the jobs:
# merged PRs only, and never the bot's own (its run takes no screenshots: it
# changes only docs/, which the screenshots job skips).
name: README screenshots

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    name: Fetch and compare the PR's screenshots
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'bot/readme-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      capture: ${{ steps.shots.outputs.found == 'true' }}
      changed: ${{ steps.compare.outputs.changed }}
      run-url: ${{ steps.shots.outputs.run_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # The PR's last CI run, filed under its head commit. A run whose E2E
      # job was skipped (a docs-only PR) or whose screenshots failed has no
      # artifact: then there's nothing to refresh.
      - name: Fetch the PR's screenshots
        id: shots
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name ios-screenshots --dir "$RUNNER_TEMP/ios"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
          else
            echo "No ios-screenshots artifact for $HEAD_SHA; nothing to refresh."
          fi

      - name: Install ImageMagick
        if: steps.shots.outputs.found == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick

      # The screenshots job's light shots (e2e/screenshots/screens.yaml) under the
      # README's names, at its width. -strip drops the timestamps and colour
      # profile, so an unchanged screen comes out byte for byte the same.
      - name: Shrink them to the README's size
        if: steps.shots.outputs.found == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fresh"
          for pair in light-01-setup.png:setup.png light-03-sift.png:sift.png light-07-done.png:done.png; do
            from="$RUNNER_TEMP/ios/${pair%%:*}"
            to="$RUNNER_TEMP/fresh/${pair##*:}"
            if [ -f "$from" ]; then
              convert "$from" -resize 780x -strip "$to"
            else
              echo "::warning::No ${pair%%:*} in the artifact; docs/screenshots/${pair##*:} stays as it is."
            fi
          done

      # pixelmatch and pngjs, which the comparison imports from here.
      - uses: actions/setup-node@v7
        if: steps.shots.outputs.found == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.shots.outputs.found == 'true'
        run: npm ci --ignore-scripts

      - id: compare
        if: steps.shots.outputs.found == 'true'
        uses: jbhirsh/ci/readme-screenshots/compare@main
        with:
          fresh: ${{ runner.temp }}/fresh

  publish:
    name: Open, update or close the bot PR
    needs: capture
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'bot/readme-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: jbhirsh/ci/readme-screenshots@main
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          capture: ${{ needs.capture.outputs.capture }}
          changed: ${{ needs.capture.outputs.changed }}
          base: main
          source-pr: ${{ github.event.pull_request.number }}
          run-url: ${{ needs.capture.outputs.run-url }}
