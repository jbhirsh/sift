name: PR visuals

# jbhirsh/ci's visuals action. This app has `visuals.sharedTemplate` on, so
# it passes every PR: visual review (`Visual changes`, visual-review.yml)
# decides whether a screen changed, and whether a change to motion needs a
# GIF rather than a still is a judgment call that Claude Review makes
# (claude-review.yml). The workflow stays until it retires from the branch
# rule and its job (jbhirsh/ci#64).
#
# No trigger-level `paths:` filter: like every gating workflow here it reports
# on every PR, so it can be a required check.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

# A new push or edit supersedes the previous run.
concurrency:
  group: pr-visuals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  visuals:
    name: PR visuals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: jbhirsh/ci/visuals@main
