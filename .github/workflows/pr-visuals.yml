name: PR visuals

# A PR that changes the UI must show it: jbhirsh/ci's visuals action fails
# when a screen, component, the root App, the theme or an image asset (the
# `visuals` globs in .github/ci.json) changes and the description has no
# image, GIF or video and no ticked "No visible UI change". It runs on
# description edits too, so adding the pictures turns it green without a new
# push. Whether a change to motion needs a GIF rather than a still is a
# judgment call that Claude Review makes (claude-review.yml).
#
# No trigger-level `paths:` filter: like every gating workflow here it reports
# on every PR, so it can be a required check (CLAUDE.md).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

# A new push or edit supersedes the previous run.
concurrency:
  group: pr-visuals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  visuals:
    name: PR visuals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: jbhirsh/ci/visuals@main
