version: 2
updates:
  # Pinned to the shared Monday 06:00 UTC sweep slot (gitleaks.yml,
  # mutation.yml, semgrep.yml) so all weekly robot output — dependency bumps
  # and scheduled scans alike — lands together on Monday morning instead of at
  # whatever time Dependabot's default weekly window happens to fire.
  - package-ecosystem: "npm"
    directory: "/"
    assignees:
      - jbhirsh
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # The default limit is 5. From late July to late September 2026 five
    # un-mergeable PRs held every slot, so no other version update could open.
    # The ignore rules below keep known-blocked bumps from taking slots again.
    open-pull-requests-limit: 10
    # One PR per run for every version update, majors included, and one for
    # every security fix found at once, instead of a PR per package. Packages
    # that must move in lockstep land together as a side effect. The cost: a
    # major that needs code changes holds the whole bundle until it's fixed,
    # which is why the known-blocked bumps below stay ignored. Security
    # updates don't wait for Monday: they open as soon as an alert does.
    groups:
      all-updates:
        patterns: ["*"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
    ignore:
      # TS 7 (the native port) ships no JS API, which typescript-eslint and
      # dependency-cruiser load via require('typescript'); bumping that name to
      # 7 crashes eslint and makes dependency-cruiser cruise 0 modules. Adopt
      # TS 7 side by side instead (per its release notes): typescript@7 as
      # @typescript/native for type-checking, `typescript` kept on the 6.0 API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Expo SDK owns these versions (see expo's bundledNativeModules.json).
      # Bump them in an SDK upgrade via `npx expo install --fix`, never
      # piecemeal: a lone major of a native module is untested against the
      # SDK and can't be checked without a device build.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]
      # Pinned exactly or with ~ by the SDK. For 0.x packages (worklets) a
      # minor bump is breaking.
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@sentry/react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # react is pinned exactly to the SDK's version, and test-renderer (the
      # renderer under @testing-library/react-native 14) must stay on the
      # line matching that React minor: test-renderer 1.2 <-> React 19.2;
      # 1.3 bundles a React 19.3 reconciler. Both move in an SDK upgrade.
      # NOTE: ignore rules also suppress Dependabot *security* fix PRs. Alerts
      # still appear under Security > Dependabot, but for these packages (and
      # any fix that only ships in an ignored major) the fix is manual —
      # usually via the next Expo SDK upgrade.
      - dependency-name: "react"
      - dependency-name: "test-renderer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # jest-expo 57 is built on Jest 29 (babel-jest, jest-snapshot and
      # @jest/globals ^29); Jest 30 waits for the jest-expo that adopts it.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - jbhirsh
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      all-updates:
        patterns: ["*"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
