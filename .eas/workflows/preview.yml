# Keeps the preview build on the owner's phone current with main.
#
# On every push to main, EAS fingerprints the project's native layer and looks
# for a preview build made from the same fingerprint:
#   - found: only JavaScript changed, so publish an over-the-air update to the
#     "preview" channel. The installed app downloads it on launch and runs it
#     from the next cold launch (swipe Sift away, then reopen it).
#   - not found: native code changed (a Swift change, a new native package, an
#     Expo SDK bump), which an update can't carry, so make a new preview build
#     to install from its link instead.
#
# Runs on EAS Workflows (Expo's CI), not GitHub Actions: EAS holds the signing
# credentials and the build history the fingerprint is matched against.
name: Preview build or update

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    name: Fingerprint native code
    type: fingerprint
    environment: preview
  get_build:
    name: Find a preview build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # A merge landing while the previous merge's rebuild is still running
      # updates that build rather than starting a duplicate one.
      wait_for_in_progress: true
  build:
    name: Build iOS preview (native code changed)
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview
      # Add iPhones registered since the last build (eas device:create) to
      # the ad hoc provisioning profile. Uses the App Store Connect API key
      # stored on EAS, so the build stays non-interactive.
      refresh_ad_hoc_provisioning_profile: true
  update:
    name: Publish iOS update (JavaScript only)
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    type: update
    environment: preview
    # `eas update` ignores .env files, so pass the committed .env's bundler
    # flags explicitly: updates must be bundled like the build they replace.
    env:
      EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH: '1'
      EXPO_UNSTABLE_TREE_SHAKING: '1'
    params:
      platform: ios
      channel: preview
      # Preview builds don't upload Sentry source maps either
      # (SENTRY_DISABLE_AUTO_UPLOAD in eas.json).
      upload_sentry_sourcemaps: false
